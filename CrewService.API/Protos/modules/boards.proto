syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
import "common.proto";
package boards;

service BoardsSrvc {
  rpc GetAllBoards(GetAllBoardsRequest) returns (GetAllBoardsResponse) {
    option (google.api.http) = { get: "/v1/boards" };
  }
  rpc GetBoard(GetBoardRequest) returns (BoardResponse) {
    option (google.api.http) = { get: "/v1/boards/{ctrl_nbr}" };
  }
  rpc CreateBoard(CreateBoardRequest) returns (BoardResponse) {
    option (google.api.http) = { post: "/v1/boards" body: "*" };
  }
  rpc UpdateBoard(UpdateBoardRequest) returns (BoardResponse) {
    option (google.api.http) = { put: "/v1/boards/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteBoard(DeleteBoardRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/boards/{ctrl_nbr}" };
  }
  rpc GetBoardMembers(GetBoardMembersRequest) returns (GetBoardMembersResponse) {
    option (google.api.http) = { get: "/v1/boards/{extra_board_ctrl_nbr}/members" };
  }
  rpc CreateBoardMember(CreateBoardMemberRequest) returns (BoardMemberResponse) {
    option (google.api.http) = { post: "/v1/boards/members" body: "*" };
  }
}

message GetAllBoardsRequest {
  int64 craft_ctrl_nbr = 1;
  string board_kind = 2;
  int32 page_number = 3;
  int32 page_size = 4;
}
message GetAllBoardsResponse {
  repeated BoardResponse boards = 1;
  int32 total_count = 2;
}
message GetBoardRequest { int64 ctrl_nbr = 1; }
message CreateBoardRequest {
  int64 craft_ctrl_nbr = 1;
  int64 placed_group_ctrl_nbr = 2;
  string board_kind = 3;
  string name = 4;
  bool is_active = 5;
  string aux_board_type = 6;
}
message UpdateBoardRequest {
  int64 ctrl_nbr = 1;
  string name = 2;
  bool is_active = 3;
  string aux_board_type = 4;
}
message DeleteBoardRequest { int64 ctrl_nbr = 1; }
message BoardResponse {
  int64 ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  int64 placed_group_ctrl_nbr = 3;
  string board_kind = 4;
  string name = 5;
  bool is_active = 6;
  string aux_board_type = 7;
}

message GetBoardMembersRequest { int64 extra_board_ctrl_nbr = 1; }
message GetBoardMembersResponse {
  repeated BoardMemberResponse members = 1;
  int32 total_count = 2;
}
message CreateBoardMemberRequest {
  int64 extra_board_ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  int32 order_index = 3;
  string start_utc = 4;
  string end_utc = 5;
}
message BoardMemberResponse {
  int64 ctrl_nbr = 1;
  int64 extra_board_ctrl_nbr = 2;
  int64 employee_ctrl_nbr = 3;
  int32 order_index = 4;
  string state_json = 5;
  string start_utc = 6;
  string end_utc = 7;
}
