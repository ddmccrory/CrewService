syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";

service HolidayManagementSrvc {
  rpc GetUsHolidayCatalog (GetUsHolidayCatalogRequest) returns (GetUsHolidayCatalogResponse) {
    option (google.api.http) = { get: "/v1/holiday-management/catalog" };
  }
  rpc GenerateHolidaysForYear (GenerateHolidaysForYearRequest) returns (GenerateHolidaysForYearResponse) {
    option (google.api.http) = { post: "/v1/holiday-management/generate" body: "*" };
  }
}

message GetUsHolidayCatalogRequest {}

message GetUsHolidayCatalogResponse {
  repeated UsHolidayDefinitionResponse holidays = 1;
}

message UsHolidayDefinitionResponse {
  string code = 1;
  string name = 2;
}

message GenerateHolidaysForYearRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int32 year = 2;
  optional int64 parent_group_ctrl_nbr = 3;
}

message GenerateHolidaysForYearResponse {
  repeated GeneratedHolidayResponse holidays = 1;
}

message GeneratedHolidayResponse {
  int64 ctrl_nbr = 1;
  string name = 2;
  string observed_date = 3;
  bool is_active = 4;
}
