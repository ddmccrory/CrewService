syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/api/annotations.proto";

service HolidayPayrollSrvc {
  rpc EvaluateQualification (EvaluateQualificationRequest) returns (HolidayQualificationResponse) {
    option (google.api.http) = { post: "/v1/holiday-payroll/evaluate" body: "*" };
  }
  rpc GetHolidays (GetHolidaysRequest) returns (GetHolidaysResponse) {
    option (google.api.http) = { get: "/v1/holiday-payroll/holidays/{work_area_group_ctrl_nbr}" };
  }
}

message EvaluateQualificationRequest {
  int64 holiday_ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  bool worked_day_before = 3;
  bool worked_day_after = 4;
  optional string absence_code_day_before = 5;
  optional string absence_code_day_after = 6;
}

message HolidayQualificationResponse {
  bool is_qualified = 1;
  optional string disqualification_reason = 2;
}

message GetHolidaysRequest {
  int64 work_area_group_ctrl_nbr = 1;
}

message GetHolidaysResponse {
  repeated HolidayResponse holidays = 1;
}

message HolidayResponse {
  int64 ctrl_nbr = 1;
  string name = 2;
  string observed_date = 3;
  bool is_active = 4;
}

