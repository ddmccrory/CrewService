syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/api/annotations.proto";

service PayrollEngineSrvc {
  rpc ResolveEarningCode (ResolveEarningCodeRequest) returns (EarningCodeResultResponse) {
    option (google.api.http) = { post: "/v1/payroll-engine/resolve" body: "*" };
  }
  rpc CalculateTrial (PayrollRunRequest) returns (PayrollRunStatusResponse) {
    option (google.api.http) = { post: "/v1/payroll-engine/trial" body: "*" };
  }
  rpc LockFinal (PayrollRunRequest) returns (PayrollRunStatusResponse) {
    option (google.api.http) = { post: "/v1/payroll-engine/lock" body: "*" };
  }
  rpc ApproveEarning (ApproveEarningRequest) returns (EarningApprovalStatusResponse) {
    option (google.api.http) = { post: "/v1/payroll-engine/approve" body: "*" };
  }
}

message ResolveEarningCodeRequest {
  int64 work_area_group_ctrl_nbr = 1;
  bool is_off_day = 2;
  bool is_holiday = 3;
  bool is_overtime = 4;
  optional string absence_code = 5;
}

message EarningCodeResultResponse {
  string result_code = 1;
  bool requires_approval = 2;
}

message PayrollRunRequest {
  int64 run_ctrl_nbr = 1;
}

message PayrollRunStatusResponse {
  int64 ctrl_nbr = 1;
  string status = 2;
  int32 version = 3;
}

message ApproveEarningRequest {
  int64 approval_ctrl_nbr = 1;
  bool approve = 2;
}

message EarningApprovalStatusResponse {
  int64 ctrl_nbr = 1;
  string status = 2;
}
