syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
import "common.proto";
package tenant_config;

service TenantConfigSrvc {
  // GroupTypes
  rpc GetAllGroupTypes(GetAllGroupTypesRequest) returns (GetAllGroupTypesResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/group-types" };
  }
  rpc GetGroupType(GetGroupTypeRequest) returns (GroupTypeResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/group-types/{ctrl_nbr}" };
  }
  rpc CreateGroupType(CreateGroupTypeRequest) returns (GroupTypeResponse) {
    option (google.api.http) = { post: "/v1/tenant-config/group-types" body: "*" };
  }
  rpc UpdateGroupType(UpdateGroupTypeRequest) returns (GroupTypeResponse) {
    option (google.api.http) = { put: "/v1/tenant-config/group-types/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteGroupType(DeleteGroupTypeRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/tenant-config/group-types/{ctrl_nbr}" };
  }

  // Groups
  rpc GetAllGroups(GetAllGroupsRequest) returns (GetAllGroupsResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/groups" };
  }
  rpc GetGroup(GetGroupRequest) returns (GroupResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/groups/{ctrl_nbr}" };
  }
  rpc CreateGroup(CreateGroupRequest) returns (GroupResponse) {
    option (google.api.http) = { post: "/v1/tenant-config/groups" body: "*" };
  }
  rpc UpdateGroup(UpdateGroupRequest) returns (GroupResponse) {
    option (google.api.http) = { put: "/v1/tenant-config/groups/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteGroup(DeleteGroupRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/tenant-config/groups/{ctrl_nbr}" };
  }

  // Query groups by type name (e.g. "Railroad")
  rpc GetGroupsByTypeName(GetGroupsByTypeNameRequest) returns (GetAllGroupsResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/groups/by-type-name" };
  }

  // Tree / WorkArea queries
  rpc GetGroupTree(GetGroupTreeRequest) returns (GetAllGroupsResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/groups/tree" };
  }
  rpc GetWorkAreas(GetWorkAreasRequest) returns (GetAllGroupsResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/work-areas" };
  }
  rpc GetAncestors(GetAncestorsRequest) returns (GetAllGroupsResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/groups/{ctrl_nbr}/ancestors" };
  }

  // Group Attribute Definitions
  rpc GetAttributeDefinitions(GetAttributeDefinitionsRequest) returns (GetAttributeDefinitionsResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/attribute-definitions/by-group-type/{group_type_ctrl_nbr}" };
  }
  rpc GetAttributeDefinition(GetAttributeDefinitionRequest) returns (AttributeDefinitionResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/attribute-definitions/{ctrl_nbr}" };
  }
  rpc CreateAttributeDefinition(CreateAttributeDefinitionRequest) returns (AttributeDefinitionResponse) {
    option (google.api.http) = { post: "/v1/tenant-config/attribute-definitions" body: "*" };
  }
  rpc UpdateAttributeDefinition(UpdateAttributeDefinitionRequest) returns (AttributeDefinitionResponse) {
    option (google.api.http) = { put: "/v1/tenant-config/attribute-definitions/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteAttributeDefinition(DeleteAttributeDefinitionRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/tenant-config/attribute-definitions/{ctrl_nbr}" };
  }

  // Group Attribute Values
  rpc GetAttributeValues(GetAttributeValuesRequest) returns (GetAttributeValuesResponse) {
    option (google.api.http) = { get: "/v1/tenant-config/attribute-values/by-group/{group_ctrl_nbr}" };
  }
  rpc SetAttributeValue(SetAttributeValueRequest) returns (AttributeValueResponse) {
    option (google.api.http) = { post: "/v1/tenant-config/attribute-values" body: "*" };
  }
  rpc DeleteAttributeValue(DeleteAttributeValueRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/tenant-config/attribute-values/{ctrl_nbr}" };
  }
}

// GroupType messages
message GetAllGroupTypesRequest {
  int32 page_number = 1;
  int32 page_size = 2;
}

message GetAllGroupTypesResponse {
  repeated GroupTypeResponse group_types = 1;
  int32 total_count = 2;
}

message GetGroupTypeRequest {
  int64 ctrl_nbr = 1;
}

message CreateGroupTypeRequest {
  string name = 1;
  string description = 2;
  bool is_work_area = 3;
  string flags_json = 4;
  int64 parent_ctrl_nbr = 5;
  int64 railroad_ctrl_nbr = 6;
  int64 parent_group_type_ctrl_nbr = 7;
}

message UpdateGroupTypeRequest {
  int64 ctrl_nbr = 1;
  string name = 2;
  string description = 3;
  bool is_work_area = 4;
  string flags_json = 5;
  int64 parent_ctrl_nbr = 6;
  int64 railroad_ctrl_nbr = 7;
  int64 parent_group_type_ctrl_nbr = 8;
}

message DeleteGroupTypeRequest {
  int64 ctrl_nbr = 1;
}

message GroupTypeResponse {
  int64 ctrl_nbr = 1;
  string name = 2;
  string description = 3;
  bool is_work_area = 4;
  string flags_json = 5;
  int64 parent_ctrl_nbr = 6;
  int64 railroad_ctrl_nbr = 7;
  int64 parent_group_type_ctrl_nbr = 8;
}

// Group messages
message GetAllGroupsRequest {
  int64 parent_group_ctrl_nbr = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message GetAllGroupsResponse {
  repeated GroupResponse groups = 1;
  int32 total_count = 2;
}

message GetGroupRequest {
  int64 ctrl_nbr = 1;
}

message CreateGroupRequest {
  int64 group_type_ctrl_nbr = 1;
  string name = 2;
  int64 parent_group_ctrl_nbr = 3;
  string path = 4;
  bool is_work_area = 5;
  string code = 6;
  int64 parent_ctrl_nbr = 7;
}

message UpdateGroupRequest {
  int64 ctrl_nbr = 1;
  string name = 2;
  int64 parent_group_ctrl_nbr = 3;
  string path = 4;
  bool is_work_area = 5;
  string code = 6;
  int64 parent_ctrl_nbr = 7;
}

message DeleteGroupRequest {
  int64 ctrl_nbr = 1;
}

message GroupResponse {
  int64 ctrl_nbr = 1;
  int64 group_type_ctrl_nbr = 2;
  string name = 3;
  int64 parent_group_ctrl_nbr = 4;
  string path = 5;
  bool is_work_area = 6;
  string code = 7;
  int64 parent_ctrl_nbr = 8;
}

message GetGroupsByTypeNameRequest {
  string type_name = 1;
  int64 parent_ctrl_nbr = 2;
}

// Tree / WorkArea queries
message GetGroupTreeRequest {
  int64 root_ctrl_nbr = 1;
}

message GetWorkAreasRequest {}

message GetAncestorsRequest {
  int64 ctrl_nbr = 1;
}

// Attribute Definition messages
message GetAttributeDefinitionsRequest {
  int64 group_type_ctrl_nbr = 1;
}

message GetAttributeDefinitionsResponse {
  repeated AttributeDefinitionResponse attribute_definitions = 1;
}

message GetAttributeDefinitionRequest {
  int64 ctrl_nbr = 1;
}

message CreateAttributeDefinitionRequest {
  int64 group_type_ctrl_nbr = 1;
  string attribute_name = 2;
  string data_type = 3;
  bool is_required = 4;
  string default_value = 5;
}

message UpdateAttributeDefinitionRequest {
  int64 ctrl_nbr = 1;
  string attribute_name = 2;
  string data_type = 3;
  bool is_required = 4;
  string default_value = 5;
}

message DeleteAttributeDefinitionRequest {
  int64 ctrl_nbr = 1;
}

message AttributeDefinitionResponse {
  int64 ctrl_nbr = 1;
  int64 group_type_ctrl_nbr = 2;
  string attribute_name = 3;
  string data_type = 4;
  bool is_required = 5;
  string default_value = 6;
}

// Attribute Value messages
message GetAttributeValuesRequest {
  int64 group_ctrl_nbr = 1;
}

message GetAttributeValuesResponse {
  repeated AttributeValueResponse attribute_values = 1;
}

message SetAttributeValueRequest {
  int64 group_ctrl_nbr = 1;
  int64 attribute_definition_ctrl_nbr = 2;
  string value = 3;
}

message DeleteAttributeValueRequest {
  int64 ctrl_nbr = 1;
}

message AttributeValueResponse {
  int64 ctrl_nbr = 1;
  int64 group_ctrl_nbr = 2;
  int64 attribute_definition_ctrl_nbr = 3;
  string value = 4;
}
