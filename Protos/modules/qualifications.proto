syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common.proto";

service QualificationsSrvc {
  rpc CreateQualificationType (CreateQualificationTypeRequest) returns (QualificationTypeResponse) {
    option (google.api.http) = { post: "/v1/qualifications/types" body: "*" };
  }

  rpc UpdateQualificationType (UpdateQualificationTypeRequest) returns (QualificationTypeResponse) {
    option (google.api.http) = { post: "/v1/qualifications/types/update" body: "*" };
  }

  rpc DeleteQualificationType (DeleteQualificationTypeRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/qualifications/types/{qualification_type_ctrl_nbr}" };
  }

  rpc GetQualificationRequirements (GetQualificationRequirementsRequest) returns (GetQualificationRequirementsResponse) {
    option (google.api.http) = { get: "/v1/qualifications/types/{qualification_type_ctrl_nbr}/requirements" };
  }

  rpc AddQualificationRequirement (AddQualificationRequirementRequest) returns (QualificationRequirementResponse) {
    option (google.api.http) = { post: "/v1/qualifications/requirements" body: "*" };
  }

  rpc UpdateQualificationRequirement (UpdateQualificationRequirementRequest) returns (QualificationRequirementResponse) {
    option (google.api.http) = { post: "/v1/qualifications/requirements/update" body: "*" };
  }

  rpc RemoveQualificationRequirement (RemoveQualificationRequirementRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/qualifications/requirements/{requirement_ctrl_nbr}" };
  }

  rpc SetQualificationTypeActive (SetQualificationTypeActiveRequest) returns (QualificationTypeResponse) {
    option (google.api.http) = { post: "/v1/qualifications/types/active" body: "*" };
  }

  rpc GetQualificationTypes (GetQualificationTypesRequest) returns (GetQualificationTypesResponse) {
    option (google.api.http) = { get: "/v1/qualifications/types/{parent_ctrl_nbr}" };
  }

  rpc GetRegulatoryQualifications (GetRegulatoryQualificationsRequest) returns (GetRegulatoryQualificationsResponse) {
    option (google.api.http) = { get: "/v1/qualifications/regulatory-catalog" };
  }

  rpc GetEmployeeQualifications (GetEmployeeQualificationsRequest) returns (GetEmployeeQualificationsResponse) {
    option (google.api.http) = { get: "/v1/qualifications/employees/{employee_ctrl_nbr}" };
  }

  rpc GrantEmployeeQualification (GrantEmployeeQualificationRequest) returns (EmployeeQualificationResponse) {
    option (google.api.http) = { post: "/v1/qualifications/grant" body: "*" };
  }

  rpc RevokeEmployeeQualification (RevokeEmployeeQualificationRequest) returns (EmployeeQualificationResponse) {
    option (google.api.http) = { post: "/v1/qualifications/revoke" body: "*" };
  }

  rpc SuspendComputedQualification (SuspendComputedQualificationRequest) returns (SuspendComputedQualificationResponse) {
    option (google.api.http) = { post: "/v1/qualifications/suspend" body: "*" };
  }

  rpc LiftQualificationSuspension (LiftQualificationSuspensionRequest) returns (SuspendComputedQualificationResponse) {
    option (google.api.http) = { post: "/v1/qualifications/suspend/lift" body: "*" };
  }

  rpc CheckEligibility (CheckEligibilityRequest) returns (CheckEligibilityResponse) {
    option (google.api.http) = { post: "/v1/qualifications/check-eligibility" body: "*" };
  }
  rpc GetEligibleEmployeesForCraftRole (GetEligibleEmployeesForCraftRoleRequest) returns (GetEligibleEmployeesForCraftRoleResponse) {
    option (google.api.http) = { get: "/v1/qualifications/eligible-employees/craft-role/{craft_role_ctrl_nbr}" };
  }
}

message GetQualificationTypesRequest {
  int64 parent_ctrl_nbr = 1;
  bool active_only = 2;
}

message CreateQualificationTypeRequest {
  int64 parent_ctrl_nbr = 1;
  optional int64 scope_group_ctrl_nbr = 2;
  optional int64 craft_ctrl_nbr = 3;
  string code = 4;
  string name = 5;
  string description = 6;
  string evaluation_strategy = 7;
  optional int32 expiration_months = 8;
  bool calendar_year_expiry = 9;
  int32 grace_days = 10;
  int32 renewal_lead_days = 11;
  bool is_blocking = 12;
  optional int64 regulatory_qualification_ctrl_nbr = 13;
  optional string restriction_label = 14;
}

message SetQualificationTypeActiveRequest {
  int64 qualification_type_ctrl_nbr = 1;
  bool is_active = 2;
}

message UpdateQualificationTypeRequest {
  int64 qualification_type_ctrl_nbr = 1;
  string name = 2;
  string description = 3;
  optional int32 expiration_months = 4;
  bool calendar_year_expiry = 5;
  int32 grace_days = 6;
  int32 renewal_lead_days = 7;
  bool is_blocking = 8;
  optional int64 scope_group_ctrl_nbr = 9;
  optional int64 craft_ctrl_nbr = 10;
  string evaluation_strategy = 11;
  optional string restriction_label = 12;
}

message DeleteQualificationTypeRequest {
  int64 qualification_type_ctrl_nbr = 1;
}

message GetQualificationRequirementsRequest {
  int64 qualification_type_ctrl_nbr = 1;
}

message QualificationRequirementResponse {
  int64 ctrl_nbr = 1;
  int64 qualification_type_ctrl_nbr = 2;
  string requirement_kind = 3;
  int32 threshold = 4;
  string threshold_unit = 5;
  string description = 6;
  string event_source = 7;
  string activity_filter = 8;
  optional int64 required_qual_type_ctrl_nbr = 9;
  optional int64 required_regulatory_qual_ctrl_nbr = 10;
}

message GetQualificationRequirementsResponse {
  repeated QualificationRequirementResponse requirements = 1;
}

message AddQualificationRequirementRequest {
  int64 qualification_type_ctrl_nbr = 1;
  string requirement_kind = 2;
  int32 threshold = 3;
  string threshold_unit = 4;
  string description = 5;
  string event_source = 6;
  string activity_filter = 7;
  optional int64 required_qual_type_ctrl_nbr = 8;
  optional int64 required_regulatory_qual_ctrl_nbr = 9;
}

message UpdateQualificationRequirementRequest {
  int64 requirement_ctrl_nbr = 1;
  int32 threshold = 2;
  string threshold_unit = 3;
  string description = 4;
  string event_source = 5;
  string activity_filter = 6;
  optional int64 required_qual_type_ctrl_nbr = 7;
  optional int64 required_regulatory_qual_ctrl_nbr = 8;
}

message RemoveQualificationRequirementRequest {
  int64 requirement_ctrl_nbr = 1;
}

message QualificationTypeResponse {
  int64 ctrl_nbr = 1;
  int64 parent_ctrl_nbr = 2;
  optional int64 scope_group_ctrl_nbr = 3;
  optional int64 craft_ctrl_nbr = 4;
  string code = 5;
  string name = 6;
  string description = 7;
  string evaluation_strategy = 8;
  optional int32 expiration_months = 9;
  bool calendar_year_expiry = 10;
  int32 grace_days = 11;
  int32 renewal_lead_days = 12;
  bool is_blocking = 13;
  bool is_active = 14;
  bool is_system_seeded = 15;
  optional int64 regulatory_qualification_ctrl_nbr = 16;
  optional string restriction_label = 17;
}

message GetQualificationTypesResponse {
  repeated QualificationTypeResponse qualification_types = 1;
}

message GetRegulatoryQualificationsRequest {}

message RegulatoryQualificationCatalogItem {
  int64 ctrl_nbr = 1;
  string code = 2;
  string cfr_part = 3;
  string description = 4;
}

message GetRegulatoryQualificationsResponse {
  repeated RegulatoryQualificationCatalogItem qualifications = 1;
}

message GetEmployeeQualificationsRequest {
  int64 employee_ctrl_nbr = 1;
}

message EmployeeQualificationResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  int64 qualification_type_ctrl_nbr = 3;
  google.protobuf.Timestamp achieved_at_utc = 4;
  optional google.protobuf.Timestamp expires_at_utc = 5;
  string status = 6;
  string granted_by = 7;
  optional google.protobuf.Timestamp revoked_at_utc = 8;
  string revocation_reason = 9;
  // true = computed from requirements (display-only); false = manually granted/revocable
  bool is_computed = 10;
  // per-requirement check lines, e.g. "TimeInRole: ✓ 90 days in role met"
  repeated string requirement_details = 11;
  // suspension fields — only populated when is_computed = true and status = "Suspended"
  bool is_suspended = 12;
  int64 suspension_ctrl_nbr = 13;
  string suspension_reason = 14;
  optional google.protobuf.Timestamp auto_reinstate_at_utc = 15;
  optional int64 related_certification_ctrl_nbr = 16;
}

message GetEmployeeQualificationsResponse {
  repeated EmployeeQualificationResponse qualifications = 1;
}

message GrantEmployeeQualificationRequest {
  int64 employee_ctrl_nbr = 1;
  int64 qualification_type_ctrl_nbr = 2;
  string granted_by = 3;
  optional google.protobuf.Timestamp expires_at_utc = 4;
  string status = 5;
  string evidence_value = 6;
}

message RevokeEmployeeQualificationRequest {
  int64 employee_qualification_ctrl_nbr = 1;
  string reason = 2;
}

message CheckEligibilityRequest {
  int64 employee_ctrl_nbr = 1;
  int64 position_slot_ctrl_nbr = 2;
}

message EligibilityBlockingReason {
  string rule_code = 1;
  string description = 2;
}

message CheckEligibilityResponse {
  bool is_eligible = 1;
  repeated EligibilityBlockingReason blocking_reasons = 2;
}

message GetEligibleEmployeesForCraftRoleRequest {
  int64 craft_role_ctrl_nbr = 1;
  int64 client_ctrl_nbr = 2;
}

message EligibleEmployeeItem {
  int64 ctrl_nbr = 1;
  string employee_number = 2;
  string full_name_lnf = 3;
}

message GetEligibleEmployeesForCraftRoleResponse {
  repeated EligibleEmployeeItem employees = 1;
}

message SuspendComputedQualificationRequest {
  int64 employee_ctrl_nbr = 1;
  int64 qualification_type_ctrl_nbr = 2;
  string suspended_by = 3;
  string reason = 4;
  optional google.protobuf.Timestamp auto_reinstate_at_utc = 5;
  optional google.protobuf.Timestamp suspended_at_utc = 6;
}

message LiftQualificationSuspensionRequest {
  int64 suspension_ctrl_nbr = 1;
  string reinstated_by = 2;
  string note = 3;
}

message SuspendComputedQualificationResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  int64 qualification_type_ctrl_nbr = 3;
  string suspended_by = 4;
  string reason = 5;
  google.protobuf.Timestamp suspended_at_utc = 6;
  optional google.protobuf.Timestamp auto_reinstate_at_utc = 7;
  optional google.protobuf.Timestamp reinstated_at_utc = 8;
  string reinstated_by = 9;
  string reinstatement_note = 10;
}
