syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
package absence_vacancy;

service AbsenceVacancySrvc {
  rpc SubmitAbsenceRequest(SubmitAbsenceRequestReq) returns (AbsenceRequestResponse) {
    option (google.api.http) = { post: "/v1/absence-vacancy/requests" body: "*" };
  }
  rpc GetPendingRequests(GetPendingRequestsReq) returns (GetAbsenceRequestsResponse) {
    option (google.api.http) = { get: "/v1/absence-vacancy/requests/pending" };
  }
  rpc GetEmployeeRequests(GetEmployeeRequestsReq) returns (GetAbsenceRequestsResponse) {
    option (google.api.http) = { get: "/v1/absence-vacancy/requests/employee/{employee_ctrl_nbr}" };
  }
  rpc ApproveRequest(ApproveAbsenceReq) returns (AbsenceRequestResponse) {
    option (google.api.http) = { post: "/v1/absence-vacancy/requests/{ctrl_nbr}/approve" body: "*" };
  }
  rpc DenyRequest(DenyAbsenceReq) returns (AbsenceRequestResponse) {
    option (google.api.http) = { post: "/v1/absence-vacancy/requests/{ctrl_nbr}/deny" body: "*" };
  }
  rpc CancelRequest(CancelAbsenceReq) returns (AbsenceRequestResponse) {
    option (google.api.http) = { post: "/v1/absence-vacancy/requests/{ctrl_nbr}/cancel" body: "*" };
  }
}

message SubmitAbsenceRequestReq {
  int64 employee_ctrl_nbr = 1;
  string start_utc = 2;
  string end_utc = 3;
  string reason_code = 4;
  string notes = 5;
}
message GetPendingRequestsReq {}
message GetEmployeeRequestsReq { int64 employee_ctrl_nbr = 1; }
message ApproveAbsenceReq {
  int64 ctrl_nbr = 1;
  int64 approved_by_ctrl_nbr = 2;
}
message DenyAbsenceReq {
  int64 ctrl_nbr = 1;
  int64 denied_by_ctrl_nbr = 2;
}
message CancelAbsenceReq { int64 ctrl_nbr = 1; }

message GetAbsenceRequestsResponse {
  repeated AbsenceRequestResponse requests = 1;
  int32 total_count = 2;
}
message AbsenceRequestResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  string start_utc = 3;
  string end_utc = 4;
  string reason_code = 5;
  string status = 6;
  string notes = 7;
}
