syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
import "common.proto";
package assignments;

service AssignmentsSrvc {
  rpc GetAssignments(GetAssignmentsRequest) returns (GetAssignmentsResponse) {
    option (google.api.http) = { get: "/v1/assignments" };
  }
  rpc GetAssignment(GetStaffingAssignmentRequest) returns (StaffingAssignmentResponse) {
    option (google.api.http) = { get: "/v1/assignments/{ctrl_nbr}" };
  }
  rpc CreateAssignment(CreateStaffingAssignmentRequest) returns (StaffingAssignmentResponse) {
    option (google.api.http) = { post: "/v1/assignments" body: "*" };
  }
  rpc UpdateAssignment(UpdateStaffingAssignmentRequest) returns (StaffingAssignmentResponse) {
    option (google.api.http) = { put: "/v1/assignments/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteAssignment(DeleteStaffingAssignmentRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/assignments/{ctrl_nbr}" };
  }

  // Assignment Schedules
  rpc GetAssignmentSchedules(GetAssignmentSchedulesRequest) returns (GetAssignmentSchedulesResponse) {
    option (google.api.http) = { get: "/v1/assignments/{assignment_ctrl_nbr}/schedules" };
  }
  rpc CreateAssignmentSchedule(CreateAssignmentScheduleRequest) returns (AssignmentScheduleResponse) {
    option (google.api.http) = { post: "/v1/assignments/schedules" body: "*" };
  }
  rpc UpdateAssignmentSchedule(UpdateAssignmentScheduleRequest) returns (AssignmentScheduleResponse) {
    option (google.api.http) = { put: "/v1/assignments/schedules/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteAssignmentSchedule(DeleteAssignmentScheduleRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/assignments/schedules/{ctrl_nbr}" };
  }

  }

message GetAssignmentsRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int32 page_number = 2;
  int32 page_size = 3;
  int64 railroad_ctrl_nbr = 4;
}
message GetAssignmentsResponse {
  repeated StaffingAssignmentResponse assignments = 1;
  int32 total_count = 2;
}
message GetStaffingAssignmentRequest { int64 ctrl_nbr = 1; }
message CreateStaffingAssignmentRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int64 department_ctrl_nbr = 2;
  string code = 3;
  string name = 4;
  bool is_extra = 6;
  bool is_active = 7;
}
message UpdateStaffingAssignmentRequest {
  int64 ctrl_nbr = 1;
  int64 department_ctrl_nbr = 2;
  string code = 3;
  string name = 4;
  bool is_extra = 6;
  bool is_active = 7;
}
message DeleteStaffingAssignmentRequest { int64 ctrl_nbr = 1; }
message StaffingAssignmentResponse {
  int64 ctrl_nbr = 1;
  int64 work_area_group_ctrl_nbr = 2;
  int64 department_ctrl_nbr = 3;
  string code = 4;
  string name = 5;
  bool is_extra = 7;
  bool is_active = 8;
}

// Assignment Schedule messages
message GetAssignmentSchedulesRequest { int64 assignment_ctrl_nbr = 1; }
message GetAssignmentSchedulesResponse {
  repeated AssignmentScheduleResponse schedules = 1;
  int32 total_count = 2;
}
message CreateAssignmentScheduleRequest {
  int64 assignment_ctrl_nbr = 1;
  int64 shift_definition_ctrl_nbr = 2;
  int32 operating_days_mask = 3;
}
message UpdateAssignmentScheduleRequest {
  int64 ctrl_nbr = 1;
  int32 operating_days_mask = 2;
}
message DeleteAssignmentScheduleRequest { int64 ctrl_nbr = 1; }
message AssignmentScheduleResponse {
  int64 ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
  int64 shift_definition_ctrl_nbr = 3;
  int32 operating_days_mask = 4;
  string shift_display_name = 5;
}
