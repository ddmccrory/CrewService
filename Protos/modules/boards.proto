syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
package boards;

service BoardsSrvc {
  rpc GetCascadePolicy(GetCascadePolicyRequest) returns (CascadePolicyResponse) {
    option (google.api.http) = { get: "/v1/boards/cascade-policy/{work_area_group_ctrl_nbr}/{craft_ctrl_nbr}" };
  }
  rpc UpsertCascadePolicy(UpsertCascadePolicyRequest) returns (CascadePolicyResponse) {
    option (google.api.http) = { put: "/v1/boards/cascade-policy" body: "*" };
  }
}

message GetCascadePolicyRequest { int64 work_area_group_ctrl_nbr = 1; int64 craft_ctrl_nbr = 2; }
message UpsertCascadePolicyRequest { int64 work_area_group_ctrl_nbr = 1; int64 craft_ctrl_nbr = 2; string cascade_mode = 3; int32 max_levels = 4; bool aux_enabled = 5; int32 aux_max_levels = 6; string selection_strategy = 7; }
message CascadePolicyResponse { int64 ctrl_nbr = 1; int64 work_area_group_ctrl_nbr = 2; int64 craft_ctrl_nbr = 3; string cascade_mode = 4; int32 max_levels = 5; bool aux_enabled = 6; int32 aux_max_levels = 7; string selection_strategy = 8; }
