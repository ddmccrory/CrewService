syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/api/annotations.proto";

package notifications;

// Recipient-facing notification surface. All operations target the current
// authenticated employee ("me"); the server resolves the employee from claims,
// so no employee id is supplied by the client.
service NotificationsSrvc {
  // Full notification history for the current employee, newest first.
  rpc GetMyNotifications (google.protobuf.Empty) returns (GetNotificationsResponse) {
	option (google.api.http) = { get: "/v1/notifications/me" };
  }
  // Open notices for the current employee (acknowledgement required, unconfirmed).
  rpc GetMyUnacknowledged (google.protobuf.Empty) returns (GetNotificationsResponse) {
	option (google.api.http) = { get: "/v1/notifications/me/unacknowledged" };
  }
  // Count of open notices for the current employee (notification badge).
  rpc GetMyUnacknowledgedCount (google.protobuf.Empty) returns (UnacknowledgedCountResponse) {
	option (google.api.http) = { get: "/v1/notifications/me/unacknowledged/count" };
  }
  // Records the current employee's electronic acknowledgement of one of their notices.
  rpc AcknowledgeNotification (AcknowledgeNotificationRequest) returns (NotificationResponse) {
	option (google.api.http) = { post: "/v1/notifications/me/{ctrl_nbr}/acknowledge" body: "*" };
  }
  // Read-only global feed of all notifications for the given railroad, newest first.
  // Drives the reference notification menu for callers/managers/admins.
  rpc GetRailroadNotifications (RailroadNotificationsRequest) returns (GetNotificationsResponse) {
	option (google.api.http) = { get: "/v1/notifications/railroad/{railroad_ctrl_nbr}" };
  }
  // Count of open (unacknowledged, ack-required) notices across the given railroad.
  rpc GetRailroadUnacknowledgedCount (RailroadNotificationsRequest) returns (UnacknowledgedCountResponse) {
	option (google.api.http) = { get: "/v1/notifications/railroad/{railroad_ctrl_nbr}/unacknowledged/count" };
  }
  // Read-only feed of a single employee's notifications, newest first. Drives the
  // employee-detail Notifications tab for managerial review (scoped server-side).
  rpc GetEmployeeNotifications (EmployeeNotificationsRequest) returns (GetNotificationsResponse) {
	option (google.api.http) = { get: "/v1/notifications/employee/{employee_ctrl_nbr}" };
  }
}

message RailroadNotificationsRequest {
  int64 railroad_ctrl_nbr = 1;
}

message EmployeeNotificationsRequest {
  int64 employee_ctrl_nbr = 1;
}

message AcknowledgeNotificationRequest {
  int64 ctrl_nbr = 1;
}

message GetNotificationsResponse {
  repeated NotificationResponse notifications = 1;
}

message UnacknowledgedCountResponse {
  int32 count = 1;
}

message NotificationResponse {
  int64 ctrl_nbr = 1;
  int64 railroad_ctrl_nbr = 2;
  int64 employee_ctrl_nbr = 3;
  string category = 4;
  string message = 5;
  bool requires_acknowledgement = 6;
  bool is_acknowledged = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp effective_at = 9;
  optional string subject_type = 10;
  optional int64 subject_ctrl_nbr = 11;
  // Recipient display name; populated for the railroad-wide feed, empty for "me" calls.
  string employee_name = 12;
  // Offset-carrying ISO-8601 timestamps localized to the notification's railroad work-area
  // time zone (via IWorkAreaClock). The UTC Timestamps above remain authoritative for
  // sorting/interchange; these are display-only. Empty when no zone is configured.
  string created_at_local = 13;
  string effective_at_local = 14;
}
