syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";

service VacancyAssignmentSrvc {
  rpc TriggerResolution (TriggerResolutionRequest) returns (VacancyResolutionRunResponse) {
    option (google.api.http) = { post: "/v1/vacancy-assignment/trigger" body: "*" };
  }
  rpc GetResolutionRuns (GetResolutionRunsRequest) returns (GetResolutionRunsResponse) {
    option (google.api.http) = { get: "/v1/vacancy-assignment/runs/{work_area_group_ctrl_nbr}" };
  }
}

message TriggerResolutionRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int64 shift_instance_ctrl_nbr = 2;
  int64 craft_ctrl_nbr = 3;
}

message VacancyResolutionRunResponse {
  int64 ctrl_nbr = 1;
  string status = 2;
  int32 slots_evaluated = 3;
  int32 slots_filled = 4;
  google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp completed_at = 6;
}

message GetResolutionRunsRequest {
  int64 shift_instance_ctrl_nbr = 1;
}

message GetResolutionRunsResponse {
  repeated VacancyResolutionRunResponse runs = 1;
}
