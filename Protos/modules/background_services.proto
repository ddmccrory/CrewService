syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";

service BackgroundServicesSrvc {
  rpc GetWorkerSchedules (GetWorkerSchedulesRequest) returns (GetWorkerSchedulesResponse);
  rpc UpdateSchedule (UpdateScheduleRequest) returns (WorkerScheduleResponse);
  rpc GetExecutionLogs (GetExecutionLogsRequest) returns (GetExecutionLogsResponse);
}

message GetWorkerSchedulesRequest {
  optional string worker_type = 1;
}

message GetWorkerSchedulesResponse {
  repeated WorkerScheduleResponse schedules = 1;
}

message WorkerScheduleResponse {
  int64 ctrl_nbr = 1;
  string worker_type = 2;
  bool is_enabled = 3;
  optional google.protobuf.Timestamp next_fire_utc = 4;
  optional string last_run_status = 5;
  optional google.protobuf.Timestamp last_run_utc = 6;
}

message UpdateScheduleRequest {
  int64 ctrl_nbr = 1;
  bool is_enabled = 2;
  optional string cron_expression = 3;
}

message GetExecutionLogsRequest {
  int64 worker_schedule_ctrl_nbr = 1;
  int32 limit = 2;
}

message GetExecutionLogsResponse {
  repeated ExecutionLogResponse logs = 1;
}

message ExecutionLogResponse {
  int64 ctrl_nbr = 1;
  string status = 2;
  google.protobuf.Timestamp started_at = 3;
  optional google.protobuf.Timestamp completed_at = 4;
  optional string error_message = 5;
}
