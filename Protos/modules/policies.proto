syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
package policies;

service PoliciesSrvc {
  rpc GetAbsenceApprovalPolicy(GetAbsenceApprovalPolicyRequest) returns (AbsenceApprovalPolicyResponse) {
    option (google.api.http) = { get: "/v1/policies/absence-approval/{railroad_ctrl_nbr}" };
  }
  rpc UpsertAbsenceApprovalPolicy(UpsertAbsenceApprovalPolicyRequest) returns (AbsenceApprovalPolicyResponse) {
    option (google.api.http) = { put: "/v1/policies/absence-approval/{railroad_ctrl_nbr}" body: "*" };
  }
  rpc GetCraftOperationsPolicy(GetCraftOperationsPolicyRequest) returns (CraftOperationsPolicyResponse) {
    option (google.api.http) = { get: "/v1/policies/craft-operations/{craft_ctrl_nbr}" };
  }
  rpc UpsertCraftOperationsPolicy(UpsertCraftOperationsPolicyRequest) returns (CraftOperationsPolicyResponse) {
    option (google.api.http) = { put: "/v1/policies/craft-operations/{craft_ctrl_nbr}" body: "*" };
  }
  rpc GetDisplacementPolicy(GetDisplacementPolicyRequest) returns (DisplacementPolicyResponse) {
    option (google.api.http) = { get: "/v1/policies/displacement/{craft_ctrl_nbr}" };
  }
  rpc UpsertDisplacementPolicy(UpsertDisplacementPolicyRequest) returns (DisplacementPolicyResponse) {
    option (google.api.http) = { put: "/v1/policies/displacement/{craft_ctrl_nbr}" body: "*" };
  }
  rpc GetBulletinPolicy(GetBulletinPolicyRequest) returns (BulletinPolicyResponse) {
    option (google.api.http) = { get: "/v1/policies/bulletin/{craft_ctrl_nbr}" };
  }
  rpc UpsertBulletinPolicy(UpsertBulletinPolicyRequest) returns (BulletinPolicyResponse) {
    option (google.api.http) = { put: "/v1/policies/bulletin/{craft_ctrl_nbr}" body: "*" };
  }
  rpc GetCallSheetRule(GetCallSheetRuleRequest) returns (CallSheetRuleResponse) {
    option (google.api.http) = { get: "/v1/policies/call-sheet/{department_ctrl_nbr}" };
  }
  rpc UpsertCallSheetRule(UpsertCallSheetRuleRequest) returns (CallSheetRuleResponse) {
    option (google.api.http) = { put: "/v1/policies/call-sheet/{department_ctrl_nbr}" body: "*" };
  }
  rpc GetCraftCallSheetRule(GetCraftCallSheetRuleRequest) returns (CraftCallSheetRuleResponse) {
    option (google.api.http) = { get: "/v1/policies/call-sheet/craft/{craft_ctrl_nbr}" };
  }
  rpc UpsertCraftCallSheetRule(UpsertCraftCallSheetRuleRequest) returns (CraftCallSheetRuleResponse) {
    option (google.api.http) = { put: "/v1/policies/call-sheet/craft/{craft_ctrl_nbr}" body: "*" };
  }
  rpc GetDepartmentReassignmentRule(GetDepartmentReassignmentRuleRequest) returns (DepartmentReassignmentRuleResponse) {
    option (google.api.http) = { get: "/v1/policies/department-reassignment/{department_ctrl_nbr}" };
  }
  rpc UpsertDepartmentReassignmentRule(UpsertDepartmentReassignmentRuleRequest) returns (DepartmentReassignmentRuleResponse) {
    option (google.api.http) = { put: "/v1/policies/department-reassignment/{department_ctrl_nbr}" body: "*" };
  }
  rpc GetSeniorityMovePolicy(GetSeniorityMovePolicyRequest) returns (SeniorityMovePolicyResponse) {
    option (google.api.http) = { get: "/v1/policies/seniority-move/{railroad_ctrl_nbr}/{craft_ctrl_nbr}" };
  }
  rpc UpsertSeniorityMovePolicy(UpsertSeniorityMovePolicyRequest) returns (SeniorityMovePolicyResponse) {
    option (google.api.http) = { put: "/v1/policies/seniority-move/{railroad_ctrl_nbr}/{craft_ctrl_nbr}" body: "*" };
  }
  rpc GetNoAccessPolicy(GetNoAccessPolicyRequest) returns (NoAccessPolicyResponse) {
    option (google.api.http) = { get: "/v1/policies/no-access/{railroad_ctrl_nbr}/{craft_ctrl_nbr}" };
  }
  rpc UpsertNoAccessPolicy(UpsertNoAccessPolicyRequest) returns (NoAccessPolicyResponse) {
    option (google.api.http) = { put: "/v1/policies/no-access/{railroad_ctrl_nbr}/{craft_ctrl_nbr}" body: "*" };
  }
  rpc ListNoAccessPoliciesByRailroad(ListNoAccessPoliciesByRailroadRequest) returns (ListNoAccessPoliciesByRailroadResponse) {
    option (google.api.http) = { get: "/v1/policies/no-access/railroad/{railroad_ctrl_nbr}" };
  }
  rpc CreateMissingNoAccessPolicy(CreateMissingNoAccessPolicyRequest) returns (NoAccessPolicyResponse) {
    option (google.api.http) = { post: "/v1/policies/no-access/{railroad_ctrl_nbr}/{craft_ctrl_nbr}/create-missing" body: "*" };
  }
  rpc RequestNoAccessByBulletin(RequestNoAccessByBulletinRequest) returns (SeniorityMoveResponse) {
    option (google.api.http) = { post: "/v1/policies/no-access/request/by-bulletin" body: "*" };
  }
  rpc ExerciseSeniorityMove(ExerciseSeniorityMoveRequest) returns (SeniorityMoveResponse) {
    option (google.api.http) = { post: "/v1/policies/seniority-move/exercise" body: "*" };
  }
  rpc ApproveSeniorityMove(ApproveSeniorityMoveRequest) returns (SeniorityMoveResponse) {
    option (google.api.http) = { post: "/v1/policies/seniority-move/{move_ctrl_nbr}/approve" body: "*" };
  }
  rpc RejectSeniorityMove(RejectSeniorityMoveRequest) returns (SeniorityMoveResponse) {
    option (google.api.http) = { post: "/v1/policies/seniority-move/{move_ctrl_nbr}/reject" body: "*" };
  }
  rpc CancelSeniorityMove(CancelSeniorityMoveRequest) returns (SeniorityMoveResponse) {
    option (google.api.http) = { post: "/v1/policies/seniority-move/{move_ctrl_nbr}/cancel" body: "*" };
  }
  rpc CompleteSeniorityMove(CompleteSeniorityMoveRequest) returns (SeniorityMoveResponse) {
    option (google.api.http) = { post: "/v1/policies/seniority-move/{move_ctrl_nbr}/complete" body: "*" };
  }
  rpc PreviewSeniorityMoveEffectiveDate(PreviewSeniorityMoveEffectiveDateRequest) returns (PreviewSeniorityMoveEffectiveDateResponse) {
    option (google.api.http) = { post: "/v1/policies/seniority-move/preview-effective-date" body: "*" };
  }
  rpc GetSeniorityMovesByEmployee(GetSeniorityMovesByEmployeeRequest) returns (GetSeniorityMovesResponse) {
    option (google.api.http) = { get: "/v1/policies/seniority-moves/employee/{employee_ctrl_nbr}" };
  }
  rpc GetSeniorityMovesByCraft(GetSeniorityMovesByCraftRequest) returns (GetSeniorityMovesResponse) {
    option (google.api.http) = { get: "/v1/policies/seniority-moves/craft/{craft_ctrl_nbr}" };
  }
  rpc GetPendingSeniorityMoves(GetPendingSeniorityMovesRequest) returns (GetSeniorityMovesResponse) {
    option (google.api.http) = { get: "/v1/policies/seniority-moves/pending" };
  }
  rpc GetActiveSeniorityMoves(GetActiveSeniorityMovesRequest) returns (GetSeniorityMovesResponse) {
    option (google.api.http) = { get: "/v1/policies/seniority-moves/active" };
  }
  rpc GetAllSeniorityMoves(GetAllSeniorityMovesRequest) returns (GetSeniorityMovesResponse) {
    option (google.api.http) = { get: "/v1/policies/seniority-moves" };
  }
  rpc GetNextSeniorityMoveEvent(GetNextSeniorityMoveEventRequest) returns (GetNextSeniorityMoveEventResponse) {
    option (google.api.http) = { get: "/v1/policies/seniority-moves/next-event" };
  }
}

message GetAbsenceApprovalPolicyRequest {
  int64 railroad_ctrl_nbr = 1;
}

message UpsertAbsenceApprovalPolicyRequest {
  int64 railroad_ctrl_nbr = 1;
  string approval_level = 2;
  bool is_enabled = 3;
}

message AbsenceApprovalPolicyResponse {
  int64 ctrl_nbr = 1;
  int64 railroad_ctrl_nbr = 2;
  string approval_level = 3;
  bool is_enabled = 4;
}

message GetCraftOperationsPolicyRequest {
  int64 craft_ctrl_nbr = 1;
}

message UpsertCraftOperationsPolicyRequest {
  int64 craft_ctrl_nbr = 1;
  bool hangout_auto_move_enabled = 2;
  string hangout_auto_move_target_board_type = 3;
  int32 hangout_auto_move_delay_hours = 4;
}

message CraftOperationsPolicyResponse {
  int64 ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  bool hangout_auto_move_enabled = 3;
  string hangout_auto_move_target_board_type = 4;
  int32 hangout_auto_move_delay_hours = 5;
}

message GetDisplacementPolicyRequest { int64 craft_ctrl_nbr = 1; }
message UpsertDisplacementPolicyRequest {
  int64 craft_ctrl_nbr = 1;
  int32 window_hours = 2;
  string seniority_basis = 3;
  string default_action = 4;
  string eligibility_selector_json = 5;
}
message DisplacementPolicyResponse {
  int64 ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  int32 window_hours = 3;
  string seniority_basis = 4;
  string default_action = 5;
  string eligibility_selector_json = 6;
}

// Bulletin Policy
message GetBulletinPolicyRequest { int64 craft_ctrl_nbr = 1; }
message UpsertBulletinPolicyRequest {
  int64 craft_ctrl_nbr = 1;
  int32 bid_window_hours = 2;
  bool forced_assignment_enabled = 3;
  string forced_assignment_basis = 4;
}
message BulletinPolicyResponse {
  int64 ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  int32 bid_window_hours = 3;
  bool forced_assignment_enabled = 4;
  string forced_assignment_basis = 5;
}

// Call Sheet Rule
message GetCallSheetRuleRequest { int64 department_ctrl_nbr = 1; }
message UpsertCallSheetRuleRequest {
  int64 department_ctrl_nbr = 1;
  int32 call_lead_minutes = 2;
  int32 call_duration_minutes = 3;
  string holiday_adjustment = 7;
  int32 holiday_custom_offset_minutes = 8;
  int32 global_pre_create_offset_minutes = 9;
  bool is_enabled = 10;
}
message CallSheetRuleResponse {
  int64 ctrl_nbr = 1;
  int64 department_ctrl_nbr = 2;
  int32 call_lead_minutes = 3;
  int32 call_duration_minutes = 4;
  string holiday_adjustment = 8;
  int32 holiday_custom_offset_minutes = 9;
  int32 global_pre_create_offset_minutes = 10;
  bool is_enabled = 11;
}

message GetCraftCallSheetRuleRequest { int64 craft_ctrl_nbr = 1; }
message UpsertCraftCallSheetRuleRequest {
  int64 craft_ctrl_nbr = 1;
  bool is_enabled = 2;
  int32 pre_on_duty_change_cutoff_minutes = 3;
}
message CraftCallSheetRuleResponse {
  int64 ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  bool is_enabled = 3;
  int32 pre_on_duty_change_cutoff_minutes = 4;
}

// Department Reassignment Rule
message GetDepartmentReassignmentRuleRequest { int64 department_ctrl_nbr = 1; }
message UpsertDepartmentReassignmentRuleRequest {
  int64 department_ctrl_nbr = 1;
  string target_board_type = 2;
  bool is_required = 3;
}
message DepartmentReassignmentRuleResponse {
  int64 ctrl_nbr = 1;
  int64 department_ctrl_nbr = 2;
  string target_board_type = 3;
  bool is_required = 4;
}

// Seniority Move Policy
message GetSeniorityMovePolicyRequest {
  int64 railroad_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
}
message UpsertSeniorityMovePolicyRequest {
  int64 railroad_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  int32 request_hours = 4;
  int32 cancel_hours = 5;
  bool auto_approve = 6;
  string crew_to_crew_strategy = 7;
  string crew_to_board_strategy = 8;
  string extra_board_to_crew_strategy = 9;
  string hangout_to_crew_strategy = 10;
  string extended_absence_to_crew_strategy = 11;
  string training_to_crew_strategy = 12;
  string new_hire_to_crew_strategy = 13;
  bool will_work_enabled = 14;
  int32 crew_to_crew_eligibility_days = 16;
  int32 crew_to_board_eligibility_days = 17;
  int32 extra_board_to_crew_eligibility_days = 18;
  int32 hangout_to_crew_eligibility_days = 19;
  int32 extended_absence_to_crew_eligibility_days = 20;
  int32 training_to_crew_eligibility_days = 21;
  int32 new_hire_to_crew_eligibility_days = 22;
  bool allow_scheduled_hangout_moves = 23;
}
message SeniorityMovePolicyResponse {
  int64 ctrl_nbr = 1;
  int64 railroad_ctrl_nbr = 2;
  int64 craft_ctrl_nbr = 3;
  int32 request_hours = 5;
  int32 cancel_hours = 6;
  bool auto_approve = 7;
  string crew_to_crew_strategy = 8;
  string crew_to_board_strategy = 9;
  string extra_board_to_crew_strategy = 10;
  string hangout_to_crew_strategy = 11;
  string extended_absence_to_crew_strategy = 12;
  string training_to_crew_strategy = 13;
  string new_hire_to_crew_strategy = 14;
  bool will_work_enabled = 15;
  int32 crew_to_crew_eligibility_days = 16;
  int32 crew_to_board_eligibility_days = 17;
  int32 extra_board_to_crew_eligibility_days = 18;
  int32 hangout_to_crew_eligibility_days = 19;
  int32 extended_absence_to_crew_eligibility_days = 20;
  int32 training_to_crew_eligibility_days = 21;
  int32 new_hire_to_crew_eligibility_days = 22;
  bool allow_scheduled_hangout_moves = 23;
}

message GetNoAccessPolicyRequest {
  int64 railroad_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
}

message UpsertNoAccessPolicyRequest {
  int64 railroad_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  bool is_enabled = 3;
  bool allow_employee_self_request = 4;
  bool require_bulletin_access_audit = 5;
  bool block_if_on_extended_absence = 6;
  bool require_position_currently_assigned = 7;
  bool apply_extra_board_special_case = 8;
  bool require_board_available_for_move_off = 9;
  bool auto_approve_no_access = 10;
  bool allow_admin_override = 11;
  string default_effective_mode = 12;
  bool block_if_employee_marked_off = 13;
  bool block_if_last_vacated_incumbent = 14;
}

message NoAccessPolicyResponse {
  int64 ctrl_nbr = 1;
  int64 railroad_ctrl_nbr = 2;
  int64 craft_ctrl_nbr = 3;
  bool is_enabled = 4;
  bool allow_employee_self_request = 5;
  bool require_bulletin_access_audit = 6;
  bool block_if_on_extended_absence = 7;
  bool require_position_currently_assigned = 8;
  bool apply_extra_board_special_case = 9;
  bool require_board_available_for_move_off = 10;
  bool auto_approve_no_access = 11;
  bool allow_admin_override = 12;
  string default_effective_mode = 13;
  bool block_if_employee_marked_off = 14;
  bool block_if_last_vacated_incumbent = 15;
}

message ListNoAccessPoliciesByRailroadRequest {
  int64 railroad_ctrl_nbr = 1;
}

message NoAccessPolicyListItem {
  int64 craft_ctrl_nbr = 1;
  string craft_name = 2;
  bool has_policy = 3;
  NoAccessPolicyResponse policy = 4;
}

message ListNoAccessPoliciesByRailroadResponse {
  repeated NoAccessPolicyListItem items = 1;
}

message CreateMissingNoAccessPolicyRequest {
  int64 railroad_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
}

message RequestNoAccessByBulletinRequest {
  int64 railroad_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  int64 bulletin_ctrl_nbr = 3;
  int64 employee_ctrl_nbr = 4;
  bool admin_override = 5;
}

message ExerciseSeniorityMoveRequest {
  int64 railroad_ctrl_nbr = 9;
  int64 employee_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  int64 target_position_ctrl_nbr = 3;
  int64 displaced_employee_ctrl_nbr = 4;
  int32 days_on_current_position = 5;
  string move_type = 6;
  int64 target_board_ctrl_nbr = 8;
  optional bool will_work = 10;
  optional string requested_effective_local = 11;
}
message ApproveSeniorityMoveRequest {
  int64 move_ctrl_nbr = 1;
  string effective_utc = 2;
}
message RejectSeniorityMoveRequest {
  int64 move_ctrl_nbr = 1;
  string reason = 2;
}
message CancelSeniorityMoveRequest {
  int64 move_ctrl_nbr = 1;
  string reason = 2;
}
message CompleteSeniorityMoveRequest {
  int64 move_ctrl_nbr = 1;
}
message PreviewSeniorityMoveEffectiveDateRequest {
  int64 railroad_ctrl_nbr = 9;
  int64 employee_ctrl_nbr = 1;
  int64 craft_ctrl_nbr = 2;
  int64 target_position_ctrl_nbr = 3;
  int64 displaced_employee_ctrl_nbr = 4;
  int32 days_on_current_position = 5;
  string move_type = 6;
  int64 target_board_ctrl_nbr = 8;
}
message PreviewSeniorityMoveEffectiveDateResponse {
  string effective_local = 1;
  bool will_work_offered = 2;
  bool can_schedule_hangout_move = 3;
  string max_requested_effective_local = 4;
  string current_local = 5;
}
message SeniorityMoveResponse {
  int64 ctrl_nbr = 1;
  int64 railroad_ctrl_nbr = 13;
  int64 employee_ctrl_nbr = 2;
  int64 craft_ctrl_nbr = 3;
  int64 target_position_ctrl_nbr = 4;
  int64 displaced_employee_ctrl_nbr = 5;
  string requested_local = 6;
  string effective_local = 7;
  int32 days_on_current_position = 8;
  string move_type = 9;
  string status = 10;
  string rejection_reason = 11;
  string cancellation_reason = 12;
  optional bool will_work = 14;
  // True when this move's craft policy auto-approves (or it is a NoAccess bump);
  // the admin UI hides the manual Approve/Reject actions in that case.
  bool auto_approve = 15;
  // Resolved display name of the employee ("LastName, FirstName M. (NUMBER)"); empty if unresolved.
  string employee_name = 16;
  // Resolved display name of the target position (e.g. "350 / Engineer"); empty if unresolved.
  string target_position_name = 17;
  // Work-area-local close timestamp for closed statuses (Completed/Cancelled/Rejected).
  // Empty when the move is not closed.
  string closed_local = 18;
}
message GetSeniorityMovesByEmployeeRequest { int64 employee_ctrl_nbr = 1; }
message GetSeniorityMovesByCraftRequest {
  int64 craft_ctrl_nbr = 1;
  string status = 2;
}
message GetPendingSeniorityMovesRequest {}
message GetActiveSeniorityMovesRequest {}
message GetAllSeniorityMovesRequest {}
message GetNextSeniorityMoveEventRequest {}
message GetNextSeniorityMoveEventResponse { string next_event_local = 1; }
message GetSeniorityMovesResponse {
  repeated SeniorityMoveResponse moves = 1;
  int32 total_count = 2;
}