syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common.proto";

service DailyOperationsSrvc {
  rpc GetCallSheet (GetCallSheetRequest) returns (GetCallSheetResponse) {
    option (google.api.http) = { get: "/v1/daily-operations/call-sheet/{work_area_group_ctrl_nbr}/{target_date}" };
  }
  rpc GenerateCallSheet (GenerateCallSheetRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/call-sheet/generate" body: "*" };
  }
  rpc PlaceOnDuty (PlaceOnDutyRequest) returns (OnDutyRecordResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/on-duty" body: "*" };
  }
  rpc TieUp (TieUpRequest) returns (OffDutyRecordResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/tie-up" body: "*" };
  }
  rpc AnnulPosition (AnnulPositionRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/annul-position" body: "*" };
  }
  rpc AnnulAssignment (AnnulAssignmentRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/annul-assignment" body: "*" };
  }
  rpc DoNotFillPosition (DoNotFillPositionRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/do-not-fill" body: "*" };
  }
  rpc RestorePositionSlot (RestorePositionSlotRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/restore-position" body: "*" };
  }
  rpc RestoreAssignment (RestoreAssignmentRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/restore-assignment" body: "*" };
  }
  rpc SaveAssignmentNote (SaveAssignmentNoteRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/assignment-note" body: "*" };
  }
  rpc RefreshShiftInstance (RefreshShiftInstanceRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/shift-instance/{ctrl_nbr}/refresh" };
  }
  rpc CloseShiftInstance (CloseShiftInstanceRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/daily-operations/shift-instance/{ctrl_nbr}" };
  }
  rpc ReopenShiftInstance (ReopenShiftInstanceRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/shift-instance/{ctrl_nbr}/reopen" };
  }
}

message GetCallSheetRequest {
  int64 work_area_group_ctrl_nbr = 1;
  string target_date = 2;
  bool include_closed = 3;
}

message GetCallSheetResponse {
  repeated DailyShiftInstanceResponse shifts = 1;
}

message GenerateCallSheetRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int64 shift_definition_ctrl_nbr = 2;
  string target_date = 3;
  optional int64 department_ctrl_nbr = 4;
}

message GenerateCallSheetResponse {
  DailyShiftInstanceResponse shift = 1;
}

message DailyShiftInstanceResponse {
  int64 ctrl_nbr = 1;
  string shift_code = 2;
  string shift_display_name = 3;
  string status = 4;
  optional int64 department_ctrl_nbr = 5;
  string department_name = 6;
  repeated DailyPositionSlotResponse position_slots = 7;
  repeated AssignmentNoteResponse assignment_notes = 8;
}

enum PositionSlotStatusEnum {
  POSITION_SLOT_STATUS_OPEN = 0;
  POSITION_SLOT_STATUS_FILLED = 1;
  POSITION_SLOT_STATUS_ON_DUTY = 2;
  POSITION_SLOT_STATUS_ON_DUTY_OVERTIME = 3;
  POSITION_SLOT_STATUS_TIED_UP = 4;
  POSITION_SLOT_STATUS_MARKED_OFF = 5;
  POSITION_SLOT_STATUS_UNAVAILABLE = 6;
  POSITION_SLOT_STATUS_ANNULLED = 7;
  POSITION_SLOT_STATUS_DO_NOT_FILL = 8;
  POSITION_SLOT_STATUS_EXTRA_BOARD = 9;
  POSITION_SLOT_STATUS_NO_BIDS = 10;
  POSITION_SLOT_STATUS_SKIPPED = 11;
}
message DailyPositionSlotResponse {
  int64 ctrl_nbr = 1;
  int64 crew_position_ctrl_nbr = 2;
  optional int64 incumbent_employee_ctrl_nbr = 3;
  PositionSlotStatusEnum status = 4;
  bool is_annulled = 5;
  bool is_do_not_fill = 6;
  bool is_skipped = 7;
  int32 display_order = 8;
  int64 assignment_ctrl_nbr = 9;
  string assignment_code = 10;
  string assignment_name = 11;
  string craft_role_name = 12;
  string on_duty_time = 13;
  string off_duty_time = 14;
  string group_name = 15;
  string group_code = 16;
  bool is_incumbent = 17;
}

message PlaceOnDutyRequest {
  int64 position_slot_ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  google.protobuf.Timestamp on_duty_time = 3;
  google.protobuf.Timestamp scheduled_on_duty_time = 4;
  bool is_assigned = 5;
}

message OnDutyRecordResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  google.protobuf.Timestamp on_duty_time = 3;
  bool is_late_call = 4;
  int32 consecutive_days = 5;
  string status = 6;
}

message TieUpRequest {
  int64 on_duty_record_ctrl_nbr = 1;
  google.protobuf.Timestamp off_duty_time = 2;
  string release_reason = 3;
  int64 craft_ctrl_nbr = 4;
}

message OffDutyRecordResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  google.protobuf.Timestamp off_duty_time = 3;
  int32 total_time_on_duty_minutes = 4;
  string release_reason = 5;
}

message AnnulPositionRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 position_slot_ctrl_nbr = 2;
  string reason = 3;
  google.protobuf.Timestamp annulment_date_time = 4;
}

message AnnulAssignmentRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
  string reason = 3;
  google.protobuf.Timestamp annulment_date_time = 4;
}

message DoNotFillPositionRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 position_slot_ctrl_nbr = 2;
}

message RestorePositionSlotRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 position_slot_ctrl_nbr = 2;
}

message RestoreAssignmentRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
}

message SaveAssignmentNoteRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
  string note_text = 3;
}

message AssignmentNoteResponse {
  int64 assignment_ctrl_nbr = 1;
  string note_text = 2;
}


message RefreshShiftInstanceRequest {
  int64 ctrl_nbr = 1;
}

message CloseShiftInstanceRequest {
  int64 ctrl_nbr = 1;
}

message ReopenShiftInstanceRequest {
  int64 ctrl_nbr = 1;
}
