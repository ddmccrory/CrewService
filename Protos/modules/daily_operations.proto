syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common.proto";

service DailyOperationsSrvc {
  rpc GetNextCallSheetEvent (GetNextCallSheetEventRequest) returns (GetNextCallSheetEventResponse) {
    option (google.api.http) = { get: "/v1/daily-operations/call-sheet/next-event/{work_area_group_ctrl_nbr}" };
  }
  rpc GetCallSheet (GetCallSheetRequest) returns (GetCallSheetResponse) {
    option (google.api.http) = { get: "/v1/daily-operations/call-sheet/{work_area_group_ctrl_nbr}/{target_date}" };
  }
  rpc GetVacancyResolution (GetVacancyResolutionRequest) returns (GetVacancyResolutionResponse) {
    option (google.api.http) = { get: "/v1/daily-operations/vacancy-resolution/{work_area_group_ctrl_nbr}/{target_date}" };
  }
  rpc GetVacancyFillCandidates (GetVacancyFillCandidatesRequest) returns (GetVacancyFillCandidatesResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/vacancy-resolution/candidates" body: "*" };
  }
  rpc FillVacancyPosition (FillVacancyPositionRequest) returns (FillVacancyPositionResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/vacancy-resolution/fill" body: "*" };
  }
  rpc GetVacancyFillAuditReport (GetVacancyFillAuditReportRequest) returns (GetVacancyFillAuditReportResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/vacancy-resolution/audit-report" body: "*" };
  }
  rpc GenerateCallSheet (GenerateCallSheetRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/call-sheet/generate" body: "*" };
  }
  rpc PlaceOnDuty (PlaceOnDutyRequest) returns (OnDutyRecordResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/on-duty" body: "*" };
  }
  rpc TieUp (TieUpRequest) returns (OffDutyRecordResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/tie-up" body: "*" };
  }
  rpc AnnulPosition (AnnulPositionRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/annul-position" body: "*" };
  }
  rpc AnnulAssignment (AnnulAssignmentRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/annul-assignment" body: "*" };
  }
  rpc DoNotFillPosition (DoNotFillPositionRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/do-not-fill" body: "*" };
  }
  rpc RestorePositionSlot (RestorePositionSlotRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/restore-position" body: "*" };
  }
  rpc RestoreAssignment (RestoreAssignmentRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/restore-assignment" body: "*" };
  }
  rpc SaveAssignmentNote (SaveAssignmentNoteRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/assignment-note" body: "*" };
  }
  rpc ManageAssignmentPositions (ManageAssignmentPositionsRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/manage-positions" body: "*" };
  }
  rpc RefreshShiftInstance (RefreshShiftInstanceRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/shift-instance/{ctrl_nbr}/refresh" };
  }
  rpc CloseShiftInstance (CloseShiftInstanceRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/daily-operations/shift-instance/{ctrl_nbr}" };
  }
  rpc ReopenShiftInstance (ReopenShiftInstanceRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/shift-instance/{ctrl_nbr}/reopen" };
  }
  rpc GetAvailableExtraAssignments (GetAvailableExtraAssignmentsRequest) returns (GetAvailableExtraAssignmentsResponse) {
    option (google.api.http) = { get: "/v1/daily-operations/shift-instance/{shift_instance_ctrl_nbr}/available-extra-assignments" };
  }
  rpc AddAssignmentFromTemplate (AddAssignmentFromTemplateRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/add-assignment-from-template" body: "*" };
  }
  rpc AddAdHocAssignment (AddAdHocAssignmentRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/add-ad-hoc-assignment" body: "*" };
  }
  rpc RemoveAssignment (RemoveAssignmentRequest) returns (GenerateCallSheetResponse) {
    option (google.api.http) = { post: "/v1/daily-operations/remove-assignment" body: "*" };
  }
}

message GetCallSheetRequest {
  int64 work_area_group_ctrl_nbr = 1;
  string target_date = 2;
  bool include_closed = 3;
}

message GetNextCallSheetEventRequest {
  int64 work_area_group_ctrl_nbr = 1;
}

message GetNextCallSheetEventResponse {
  string next_event_local = 1;
  string shift_code = 2;
  string target_date = 3;
  string department_name = 4;
  string shift_display_name = 5;
}

message GetCallSheetResponse {
  repeated DailyShiftInstanceResponse shifts = 1;
}

message GetVacancyResolutionRequest {
  int64 work_area_group_ctrl_nbr = 1;
  string target_date = 2;
  bool include_closed = 3;
  optional int64 department_ctrl_nbr = 4;
}

message GetVacancyResolutionResponse {
  repeated VacancyResolutionShiftCard shifts = 1;
}

message GetVacancyFillCandidatesRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int64 shift_instance_ctrl_nbr = 2;
  int64 position_slot_ctrl_nbr = 3;
  optional int64 craft_ctrl_nbr = 4;
}

message GetVacancyFillCandidatesResponse {
  repeated VacancyFillCandidateResponse candidates = 1;
}

message VacancyFillCandidateResponse {
  int64 employee_ctrl_nbr = 1;
  string employee_number = 2;
  string employee_name = 3;
  string board_type = 4;
  int32 board_order = 5;
  int64 call_sequence = 6;
  string qualification_status = 7;
  string status_display = 8;
  string projected_vacancy_display = 9;
  string on_duty_display = 10;
  repeated VacancyCandidateContactResponse contacts = 11;
}

message VacancyCandidateContactResponse {
  string contact_type = 1;
  string contact_value = 2;
  int32 calling_order = 3;
}

message FillVacancyPositionRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int64 shift_instance_ctrl_nbr = 2;
  int64 position_slot_ctrl_nbr = 3;
  int64 employee_ctrl_nbr = 4;
  bool force_override = 5;
  string force_reason = 6;
  string dispatcher_note = 7;
  bool accepted = 8;
  bool is_late_call = 9;
  string late_call_note = 10;
  string arrival_follow_up_note = 11;
  optional google.protobuf.Timestamp accepted_at_utc = 12;
  optional google.protobuf.Timestamp expected_arrival_at_utc = 13;
  optional int64 craft_ctrl_nbr = 14;
}

message FillVacancyPositionResponse {
  bool success = 1;
  string status = 2;
  int64 shift_instance_ctrl_nbr = 3;
  int64 position_slot_ctrl_nbr = 4;
  int64 employee_ctrl_nbr = 5;
  int64 on_duty_record_ctrl_nbr = 6;
  int64 vacancy_fill_log_ctrl_nbr = 7;
}

message GetVacancyFillAuditReportRequest {
  int64 work_area_group_ctrl_nbr = 1;
  string target_date = 2;
  optional int64 department_ctrl_nbr = 3;
}

message GetVacancyFillAuditReportResponse {
  repeated VacancyFillAuditRecordResponse records = 1;
}

message VacancyFillAuditRecordResponse {
  int64 vacancy_fill_log_ctrl_nbr = 1;
  int64 shift_instance_ctrl_nbr = 2;
  int64 position_slot_ctrl_nbr = 3;
  string assignment_code = 4;
  string craft_role_name = 5;
  int64 employee_ctrl_nbr = 6;
  string employee_name = 7;
  string status = 8;
  bool force_override = 9;
  string force_reason = 10;
  bool is_late_call = 11;
  string late_call_note = 12;
  string arrival_follow_up_note = 13;
  string dispatcher_note = 14;
  google.protobuf.Timestamp created_at_utc = 15;
  string created_at_local = 16;
}

message VacancyResolutionShiftCard {
  int64 shift_instance_ctrl_nbr = 1;
  string shift_code = 2;
  string shift_display_name = 3;
  string status = 4;
  optional int64 department_ctrl_nbr = 5;
  string department_name = 6;
  repeated DailyPositionSlotResponse position_slots = 7;
}

message GenerateCallSheetRequest {
  int64 work_area_group_ctrl_nbr = 1;
  int64 shift_definition_ctrl_nbr = 2;
  string target_date = 3;
  optional int64 department_ctrl_nbr = 4;
  optional string scheduled_create_local = 5;
}

message GenerateCallSheetResponse {
  DailyShiftInstanceResponse shift = 1;
}

message DailyShiftInstanceResponse {
  int64 ctrl_nbr = 1;
  string shift_code = 2;
  string shift_display_name = 3;
  string status = 4;
  optional int64 department_ctrl_nbr = 5;
  string department_name = 6;
  repeated DailyPositionSlotResponse position_slots = 7;
  repeated AssignmentNoteResponse assignment_notes = 8;
}

enum PositionSlotStatusEnum {
  POSITION_SLOT_STATUS_OPEN = 0;
  POSITION_SLOT_STATUS_FILLED = 1;
  POSITION_SLOT_STATUS_ON_DUTY = 2;
  POSITION_SLOT_STATUS_ON_DUTY_OVERTIME = 3;
  POSITION_SLOT_STATUS_TIED_UP = 4;
  POSITION_SLOT_STATUS_MARKED_OFF = 5;
  POSITION_SLOT_STATUS_UNAVAILABLE = 6;
  POSITION_SLOT_STATUS_ANNULLED = 7;
  POSITION_SLOT_STATUS_DO_NOT_FILL = 8;
  POSITION_SLOT_STATUS_EXTRA_BOARD = 9;
  POSITION_SLOT_STATUS_NO_BIDS = 10;
  POSITION_SLOT_STATUS_SKIPPED = 11;
}
message DailyPositionSlotResponse {
  int64 ctrl_nbr = 1;
  optional int64 on_duty_record_ctrl_nbr = 23;
  int64 crew_position_ctrl_nbr = 2;
  optional int64 incumbent_employee_ctrl_nbr = 3;
  PositionSlotStatusEnum status = 4;
  bool is_annulled = 5;
  bool is_do_not_fill = 6;
  bool is_skipped = 7;
  int32 display_order = 8;
  int64 assignment_ctrl_nbr = 9;
  string assignment_code = 10;
  string assignment_name = 11;
  string craft_role_name = 12;
  string on_duty_time = 13;
  string off_duty_time = 14;
  string group_name = 15;
  string group_code = 16;
  bool is_incumbent = 17;
  bool is_ad_hoc = 18;
  string crew_name = 19;
  string crew_type = 20;
  string incumbent_employee_number = 21;
  string incumbent_employee_name = 22;
  string vacancy_reason = 24;
  string vacancy_actionability = 25;
  string vacancy_display_code = 26;
  bool use_legacy_marked_off_styling = 27;
  string vacancy_impact_start_local = 28;
  optional int64 projected_employee_ctrl_nbr = 29;
  string projected_employee_number = 30;
  string projected_employee_name = 31;
}

message PlaceOnDutyRequest {
  int64 position_slot_ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  google.protobuf.Timestamp on_duty_time = 3;
  google.protobuf.Timestamp scheduled_on_duty_time = 4;
  bool is_assigned = 5;
}

message OnDutyRecordResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  google.protobuf.Timestamp on_duty_time = 3;
  bool is_late_call = 4;
  int32 consecutive_days = 5;
  string status = 6;
}

message TieUpRequest {
  int64 on_duty_record_ctrl_nbr = 1;
  google.protobuf.Timestamp off_duty_time = 2;
  string release_reason = 3;
  int64 craft_ctrl_nbr = 4;
  bool off_duty_time_confirmed = 5;
}

message OffDutyRecordResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  google.protobuf.Timestamp off_duty_time = 3;
  int32 total_time_on_duty_minutes = 4;
  string release_reason = 5;
  bool off_duty_time_confirmed = 6;
  google.protobuf.Timestamp off_duty_time_confirmed_at = 7;
  string off_duty_time_confirmed_by = 8;
}

message AnnulPositionRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 position_slot_ctrl_nbr = 2;
  string reason = 3;
  google.protobuf.Timestamp annulment_date_time = 4;
}

message AnnulAssignmentRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
  string reason = 3;
  google.protobuf.Timestamp annulment_date_time = 4;
}

message DoNotFillPositionRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 position_slot_ctrl_nbr = 2;
}

message RestorePositionSlotRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 position_slot_ctrl_nbr = 2;
}

message RestoreAssignmentRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
}

message SaveAssignmentNoteRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
  string note_text = 3;
}

message AssignmentNoteResponse {
  int64 assignment_ctrl_nbr = 1;
  string note_text = 2;
}

message ManageAssignmentPositionsRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
  repeated string added_craft_role_names = 3;
  repeated int64 removed_position_slot_ctrl_nbrs = 4;
  repeated PositionSlotOrderEntry position_slot_orders = 5;
}

message PositionSlotOrderEntry {
  int64 ctrl_nbr = 1;
  int32 display_order = 2;
}

message RefreshShiftInstanceRequest {
  int64 ctrl_nbr = 1;
}

message CloseShiftInstanceRequest {
  int64 ctrl_nbr = 1;
}

message ReopenShiftInstanceRequest {
  int64 ctrl_nbr = 1;
}

message GetAvailableExtraAssignmentsRequest {
  int64 shift_instance_ctrl_nbr = 1;
}

message GetAvailableExtraAssignmentsResponse {
  repeated AvailableAssignmentResponse assignments = 1;
}

message AvailableAssignmentResponse {
  int64 assignment_ctrl_nbr = 1;
  string assignment_code = 2;
  string assignment_name = 3;
  string on_duty_time = 4;
  string off_duty_time = 5;
  string group_name = 6;
  string group_code = 7;
  int32 position_count = 8;
}

message RemoveAssignmentRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
}

message AddAssignmentFromTemplateRequest {
  int64 shift_instance_ctrl_nbr = 1;
  int64 assignment_ctrl_nbr = 2;
  string on_duty_time = 3;
  string off_duty_time = 4;
}

message AddAdHocAssignmentRequest {
  int64 shift_instance_ctrl_nbr = 1;
  string assignment_code = 2;
  string assignment_name = 3;
  string group_name = 4;
  string group_code = 5;
  string on_duty_time = 6;
  string off_duty_time = 7;
  repeated string craft_role_names = 8;
}
