syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common.proto";

service MarkOffSrvc {
  rpc CreateAbsenceRequest (CreateAbsenceRequestMsg) returns (MarkOffAbsenceResponse) {
    option (google.api.http) = { post: "/v1/mark-off/requests" body: "*" };
  }
  rpc ApproveAbsence (ApproveAbsenceMsg) returns (AbsenceApprovalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/approve" body: "*" };
  }
  rpc DeclineAbsence (DeclineAbsenceMsg) returns (AbsenceApprovalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/decline" body: "*" };
  }
  rpc MarkOffAbsence (MarkOffAbsenceMsg) returns (AbsenceApprovalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/exercise" body: "*" };
  }
  rpc SetAbsenceAutoProcess (SetAbsenceAutoProcessMsg) returns (AbsenceApprovalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/auto-process" body: "*" };
  }
  rpc EndAbsence (EndAbsenceMsg) returns (AbsenceApprovalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/end" body: "*" };
  }
  rpc GetEndAbsenceLocalPreset (GetEndAbsenceLocalPresetMsg) returns (GetEndAbsenceLocalPresetResponse) {
    option (google.api.http) = { post: "/v1/mark-off/end/preset" body: "*" };
  }
  rpc GetCompensationBalance (GetCompensationBalanceMsg) returns (CompensationBalanceResponse) {
    option (google.api.http) = { get: "/v1/mark-off/compensation-balance/{employee_ctrl_nbr}" };
  }
  rpc GetAbsenceCodes (GetAbsenceCodesMsg) returns (GetAbsenceCodesResponse) {
    option (google.api.http) = { get: "/v1/mark-off/absence-codes/{work_area_group_ctrl_nbr}" };
  }
  rpc GetMarkOffCodes (GetMarkOffCodesMsg) returns (GetMarkOffCodesResponse) {
    option (google.api.http) = { get: "/v1/mark-off/codes" };
  }
  rpc CreateMarkOffCode (CreateMarkOffCodeMsg) returns (MarkOffCodeResponse) {
    option (google.api.http) = { post: "/v1/mark-off/codes" body: "*" };
  }
  rpc UpdateMarkOffCode (UpdateMarkOffCodeMsg) returns (MarkOffCodeResponse) {
    option (google.api.http) = { put: "/v1/mark-off/codes/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteMarkOffCode (DeleteMarkOffCodeMsg) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/mark-off/codes/{ctrl_nbr}" };
  }
  rpc GetAbsenceRequests (GetAbsenceRequestsMsg) returns (GetMarkOffAbsenceRequestsResponse) {
    option (google.api.http) = { get: "/v1/mark-off/requests" };
  }
  rpc GetOpenAbsences (GetOpenAbsencesMsg) returns (GetOpenAbsencesResponse) {
    option (google.api.http) = { get: "/v1/mark-off/open-absences" };
  }
  rpc GetScheduledAbsences (GetScheduledAbsencesMsg) returns (GetMarkOffAbsenceRequestsResponse) {
    option (google.api.http) = { get: "/v1/mark-off/scheduled-absences" };
  }
  rpc GetAbsenceApprovals (GetAbsenceApprovalsMsg) returns (GetMarkOffAbsenceRequestsResponse) {
    option (google.api.http) = { get: "/v1/mark-off/absence-approvals" };
  }
  rpc GetAbsenceHistory (GetAbsenceHistoryMsg) returns (GetMarkOffAbsenceRequestsResponse) {
    option (google.api.http) = { get: "/v1/mark-off/absence-history" };
  }
  rpc GetAbsenceApprovalContext (GetAbsenceApprovalContextMsg) returns (GetAbsenceApprovalContextResponse) {
    option (google.api.http) = { get: "/v1/mark-off/approval-context/{absence_request_ctrl_nbr}" };
  }
  rpc GetCreateAbsenceApprovalContext (GetCreateAbsenceApprovalContextMsg) returns (GetAbsenceApprovalContextResponse) {
    option (google.api.http) = { post: "/v1/mark-off/create-approval-context" body: "*" };
  }
  rpc GetCreateAbsenceEndLocalPreset (GetCreateAbsenceEndLocalPresetMsg) returns (GetCreateAbsenceEndLocalPresetResponse) {
    option (google.api.http) = { post: "/v1/mark-off/create-end-preset" body: "*" };
  }
  rpc GetCreateAbsenceStartProposal (GetCreateAbsenceStartProposalMsg) returns (GetCreateAbsenceStartProposalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/create-start-proposal" body: "*" };
  }
}

message CreateAbsenceRequestMsg {
  int64 employee_ctrl_nbr = 1;
  int64 absence_code_ctrl_nbr = 2;
  google.protobuf.Timestamp start_utc = 3;
  optional google.protobuf.Timestamp end_utc = 4;
  optional string notes = 5;
  bool is_system_generated = 6;
  optional int64 approved_by_ctrl_nbr = 7;
  bool auto_mark_off_on_approval = 8;
}

message MarkOffAbsenceResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  string reason_code = 3;
  string status = 4;
  google.protobuf.Timestamp start_utc = 5;
  optional google.protobuf.Timestamp end_utc = 6;
  bool is_system_generated = 7;
}

message ApproveAbsenceMsg {
  int64 absence_request_ctrl_nbr = 1;
  int64 officer_ctrl_nbr = 2;
  optional string notes = 3;
}

message DeclineAbsenceMsg {
  int64 absence_request_ctrl_nbr = 1;
  int64 officer_ctrl_nbr = 2;
  optional string notes = 3;
}

message MarkOffAbsenceMsg {
  int64 absence_request_ctrl_nbr = 1;
}

message SetAbsenceAutoProcessMsg {
  int64 absence_request_ctrl_nbr = 1;
  bool auto_mark_off_on_approval = 2;
}

message EndAbsenceMsg {
  int64 absence_request_ctrl_nbr = 1;
  optional int64 work_area_group_ctrl_nbr = 2;
  string end_local = 3;
}

message GetEndAbsenceLocalPresetMsg {
  optional int64 work_area_group_ctrl_nbr = 1;
  optional string base_local = 2;
  bool next_day = 3;
}

message GetEndAbsenceLocalPresetResponse {
  string end_local = 1;
}

message AbsenceApprovalResponse {
  int64 ctrl_nbr = 1;
  string status = 2;
  optional google.protobuf.Timestamp decided_at = 3;
  optional string notes = 4;
}

message GetCompensationBalanceMsg {
  int64 employee_ctrl_nbr = 1;
  string compensation_type = 2;
}

message CompensationBalanceResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  string compensation_type = 3;
  double balance_hours = 4;
}

message GetAbsenceCodesMsg {
  int64 work_area_group_ctrl_nbr = 1;
  bool active_only = 2;
}

message GetAbsenceCodesResponse {
  repeated AbsenceCodeResponse codes = 1;
}

message AbsenceCodeResponse {
  int64 ctrl_nbr = 1;
  string code = 2;
  string description = 3;
  bool is_excused = 4;
  bool is_compensated = 5;
  bool requires_approval = 6;
  bool is_system_only = 7;
  optional double default_auto_mark_up_hours = 8;
  bool is_active = 9;
}

message GetMarkOffCodesMsg {
  bool active_only = 1;
}

message GetMarkOffCodesResponse {
  repeated MarkOffCodeResponse codes = 1;
  int32 total_count = 2;
}

message MarkOffCodeResponse {
  int64 ctrl_nbr = 1;
  string code = 2;
  string description = 3;
  bool is_excused = 4;
  bool is_system_only = 5;
  bool is_active = 6;
  bool is_compensated = 7;
  bool requires_approval = 8;
  bool is_holiday_exempt = 9;
  optional double default_auto_mark_up_hours = 10;
}

message CreateMarkOffCodeMsg {
  string code = 1;
  string description = 2;
  bool is_excused = 3;
  bool is_system_only = 4;
  bool is_active = 5;
  bool is_compensated = 6;
  bool requires_approval = 7;
  bool is_holiday_exempt = 8;
  optional double default_auto_mark_up_hours = 9;
}

message UpdateMarkOffCodeMsg {
  int64 ctrl_nbr = 1;
  string code = 2;
  string description = 3;
  bool is_excused = 4;
  bool is_system_only = 5;
  bool is_active = 6;
  bool is_compensated = 7;
  bool requires_approval = 8;
  bool is_holiday_exempt = 9;
  optional double default_auto_mark_up_hours = 10;
}

message DeleteMarkOffCodeMsg {
  int64 ctrl_nbr = 1;
}

message GetAbsenceRequestsMsg {
  google.protobuf.Timestamp request_date_utc = 1;
  bool include_all_statuses = 2;
  optional int64 work_area_group_ctrl_nbr = 3;
  optional int64 craft_ctrl_nbr = 4;
  optional int64 department_ctrl_nbr = 5;
  optional int64 employee_ctrl_nbr = 6;
}

message GetOpenAbsencesMsg {
  google.protobuf.Timestamp range_start_utc = 1;
  google.protobuf.Timestamp range_end_utc = 2;
  optional int64 work_area_group_ctrl_nbr = 3;
  optional int64 craft_ctrl_nbr = 4;
  optional int64 department_ctrl_nbr = 5;
  optional int64 employee_ctrl_nbr = 6;
}

message GetScheduledAbsencesMsg {
  optional int64 work_area_group_ctrl_nbr = 1;
  optional int64 craft_ctrl_nbr = 2;
  optional int64 department_ctrl_nbr = 3;
  optional int64 employee_ctrl_nbr = 4;
  bool current_month_only = 5;
  optional bool approved_only = 6;
}

message GetAbsenceApprovalsMsg {
  optional int64 work_area_group_ctrl_nbr = 1;
  optional int64 craft_ctrl_nbr = 2;
  optional int64 department_ctrl_nbr = 3;
  optional int64 employee_ctrl_nbr = 4;
}

message GetAbsenceHistoryMsg {
  google.protobuf.Timestamp from_date_utc = 1;
  optional int64 work_area_group_ctrl_nbr = 2;
  optional int64 craft_ctrl_nbr = 3;
  optional int64 department_ctrl_nbr = 4;
  optional int64 employee_ctrl_nbr = 5;
  optional google.protobuf.Timestamp to_date_utc = 6;
}

message GetAbsenceApprovalContextMsg {
  int64 absence_request_ctrl_nbr = 1;
}

message GetCreateAbsenceApprovalContextMsg {
  int64 employee_ctrl_nbr = 1;
  int64 absence_code_ctrl_nbr = 2;
}

message GetCreateAbsenceEndLocalPresetMsg {
  int64 absence_code_ctrl_nbr = 1;
  string start_local = 2;
  optional int64 work_area_group_ctrl_nbr = 3;
}

message GetCreateAbsenceEndLocalPresetResponse {
  string end_local = 1;
}

message GetCreateAbsenceStartProposalMsg {
  int64 employee_ctrl_nbr = 1;
  optional int64 work_area_group_ctrl_nbr = 2;
}

message GetCreateAbsenceStartProposalResponse {
  google.protobuf.Timestamp start_utc = 1;
  string start_local = 2;
  optional int32 request_window_cap_days = 3;
}

message GetAbsenceApprovalContextResponse {
  string approval_level = 1;
  string approval_level_description = 2;
  repeated AbsenceApprovalOfficerItem approvers = 3;
  int64 default_officer_ctrl_nbr = 4;
  bool can_select_approved_by = 5;
}

message AbsenceApprovalOfficerItem {
  int64 officer_ctrl_nbr = 1;
  string display_name = 2;
  string employee_number = 3;
  string role = 4;
}

message GetOpenAbsencesResponse {
  repeated MarkOffAbsenceRequestListItem requests = 1;
  int32 total_count = 2;
}

message GetMarkOffAbsenceRequestsResponse {
  repeated MarkOffAbsenceRequestListItem requests = 1;
  int32 total_count = 2;
}

message MarkOffAbsenceRequestListItem {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  int64 absence_code_ctrl_nbr = 3;
  string reason_code = 4;
  string status = 5;
  google.protobuf.Timestamp start_utc = 6;
  optional google.protobuf.Timestamp end_utc = 7;
  bool is_system_generated = 8;
  bool is_waitlisted = 9;
  optional string notes = 10;
  string start_local = 11;
  string end_local = 12;
  string approval_level = 13;
  string approval_level_description = 14;
  bool auto_mark_off_on_approval = 15;
  bool can_start_absence = 16;
  bool can_end_absence = 17;
}
