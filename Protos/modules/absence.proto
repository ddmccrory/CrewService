syntax = "proto3";

option csharp_namespace = "CrewService.Presentation";

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common.proto";

service MarkOffSrvc {
  rpc CreateAbsenceRequest (CreateAbsenceRequestMsg) returns (MarkOffAbsenceResponse) {
    option (google.api.http) = { post: "/v1/mark-off/requests" body: "*" };
  }
  rpc ApproveAbsence (ApproveAbsenceMsg) returns (AbsenceApprovalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/approve" body: "*" };
  }
  rpc DeclineAbsence (DeclineAbsenceMsg) returns (AbsenceApprovalResponse) {
    option (google.api.http) = { post: "/v1/mark-off/decline" body: "*" };
  }
  rpc GetCompensationBalance (GetCompensationBalanceMsg) returns (CompensationBalanceResponse) {
    option (google.api.http) = { get: "/v1/mark-off/compensation-balance/{employee_ctrl_nbr}" };
  }
  rpc GetAbsenceCodes (GetAbsenceCodesMsg) returns (GetAbsenceCodesResponse) {
    option (google.api.http) = { get: "/v1/mark-off/absence-codes/{work_area_group_ctrl_nbr}" };
  }
  rpc GetMarkOffCodes (GetMarkOffCodesMsg) returns (GetMarkOffCodesResponse) {
    option (google.api.http) = { get: "/v1/mark-off/codes" };
  }
  rpc CreateMarkOffCode (CreateMarkOffCodeMsg) returns (MarkOffCodeResponse) {
    option (google.api.http) = { post: "/v1/mark-off/codes" body: "*" };
  }
  rpc UpdateMarkOffCode (UpdateMarkOffCodeMsg) returns (MarkOffCodeResponse) {
    option (google.api.http) = { put: "/v1/mark-off/codes/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteMarkOffCode (DeleteMarkOffCodeMsg) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/mark-off/codes/{ctrl_nbr}" };
  }
  rpc GetAbsenceRequests (GetAbsenceRequestsMsg) returns (GetMarkOffAbsenceRequestsResponse) {
    option (google.api.http) = { get: "/v1/mark-off/requests" };
  }
  rpc GetOpenAbsences (GetOpenAbsencesMsg) returns (GetOpenAbsencesResponse) {
    option (google.api.http) = { get: "/v1/mark-off/open-absences" };
  }
}

message CreateAbsenceRequestMsg {
  int64 employee_ctrl_nbr = 1;
  int64 absence_code_ctrl_nbr = 2;
  google.protobuf.Timestamp start_utc = 3;
  optional google.protobuf.Timestamp end_utc = 4;
  optional int64 position_slot_ctrl_nbr = 5;
  optional string notes = 6;
  bool is_system_generated = 7;
}

message MarkOffAbsenceResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  string reason_code = 3;
  string status = 4;
  google.protobuf.Timestamp start_utc = 5;
  optional google.protobuf.Timestamp end_utc = 6;
  bool is_system_generated = 7;
}

message ApproveAbsenceMsg {
  int64 absence_request_ctrl_nbr = 1;
  int64 officer_ctrl_nbr = 2;
  optional string notes = 3;
}

message DeclineAbsenceMsg {
  int64 absence_request_ctrl_nbr = 1;
  int64 officer_ctrl_nbr = 2;
  optional string notes = 3;
}

message AbsenceApprovalResponse {
  int64 ctrl_nbr = 1;
  string status = 2;
  optional google.protobuf.Timestamp decided_at = 3;
  optional string notes = 4;
}

message GetCompensationBalanceMsg {
  int64 employee_ctrl_nbr = 1;
  string compensation_type = 2;
}

message CompensationBalanceResponse {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  string compensation_type = 3;
  double balance_hours = 4;
}

message GetAbsenceCodesMsg {
  int64 work_area_group_ctrl_nbr = 1;
  bool active_only = 2;
}

message GetAbsenceCodesResponse {
  repeated AbsenceCodeResponse codes = 1;
}

message AbsenceCodeResponse {
  int64 ctrl_nbr = 1;
  string code = 2;
  string description = 3;
  bool is_excused = 4;
  bool is_compensated = 5;
  bool requires_approval = 6;
  bool is_system_only = 7;
  optional double default_auto_mark_up_hours = 8;
  bool is_active = 9;
}

message GetMarkOffCodesMsg {
  bool active_only = 1;
}

message GetMarkOffCodesResponse {
  repeated MarkOffCodeResponse codes = 1;
  int32 total_count = 2;
}

message MarkOffCodeResponse {
  int64 ctrl_nbr = 1;
  string code = 2;
  string description = 3;
  bool is_excused = 4;
  bool is_system_only = 5;
  bool is_active = 6;
  bool is_compensated = 7;
  bool requires_approval = 8;
  bool is_holiday_exempt = 9;
  optional double default_auto_mark_up_hours = 10;
}

message CreateMarkOffCodeMsg {
  string code = 1;
  string description = 2;
  bool is_excused = 3;
  bool is_system_only = 4;
  bool is_active = 5;
  bool is_compensated = 6;
  bool requires_approval = 7;
  bool is_holiday_exempt = 8;
  optional double default_auto_mark_up_hours = 9;
}

message UpdateMarkOffCodeMsg {
  int64 ctrl_nbr = 1;
  string code = 2;
  string description = 3;
  bool is_excused = 4;
  bool is_system_only = 5;
  bool is_active = 6;
  bool is_compensated = 7;
  bool requires_approval = 8;
  bool is_holiday_exempt = 9;
  optional double default_auto_mark_up_hours = 10;
}

message DeleteMarkOffCodeMsg {
  int64 ctrl_nbr = 1;
}

message GetAbsenceRequestsMsg {
  google.protobuf.Timestamp request_date_utc = 1;
  bool include_all_statuses = 2;
  optional int64 work_area_group_ctrl_nbr = 3;
}

message GetOpenAbsencesMsg {
  google.protobuf.Timestamp range_start_utc = 1;
  google.protobuf.Timestamp range_end_utc = 2;
}

message GetOpenAbsencesResponse {
  repeated MarkOffAbsenceRequestListItem requests = 1;
  int32 total_count = 2;
}

message GetMarkOffAbsenceRequestsResponse {
  repeated MarkOffAbsenceRequestListItem requests = 1;
  int32 total_count = 2;
}

message MarkOffAbsenceRequestListItem {
  int64 ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  int64 absence_code_ctrl_nbr = 3;
  string reason_code = 4;
  string status = 5;
  google.protobuf.Timestamp start_utc = 6;
  optional google.protobuf.Timestamp end_utc = 7;
  bool is_system_generated = 8;
  bool is_waitlisted = 9;
  optional int64 position_slot_ctrl_nbr = 10;
  optional string notes = 11;
}
