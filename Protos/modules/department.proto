syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
import "common.proto";
package department;

service DepartmentSrvc {
  rpc GetAll(GetDepartmentsRequest) returns (GetDepartmentsResponse) {
    option (google.api.http) = { get: "/v1/departments" };
  }
  rpc Create(CreateDepartmentRequest) returns (DepartmentResponse) {
    option (google.api.http) = { post: "/v1/departments" body: "*" };
  }
  rpc Update(UpdateDepartmentRequest) returns (DepartmentResponse) {
    option (google.api.http) = { put: "/v1/departments/{ctrl_nbr}" body: "*" };
  }
  rpc Delete(DeleteDepartmentRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/departments/{ctrl_nbr}" };
  }
}

message GetDepartmentsRequest {
  int64 parent_ctrl_nbr = 1;
  int64 dynamic_group_ctrl_nbr = 2;
}
message GetDepartmentsResponse {
  repeated DepartmentResponse departments = 1;
  int32 total_count = 2;
}
message CreateDepartmentRequest {
  int64 parent_ctrl_nbr = 1;
  int64 dynamic_group_ctrl_nbr = 2;
  string name = 3;
  string default_call_sheet_view = 4;
}
message UpdateDepartmentRequest {
  int64 ctrl_nbr = 1;
  string name = 2;
  string default_call_sheet_view = 3;
}
message DeleteDepartmentRequest {
  int64 ctrl_nbr = 1;
}
message DepartmentResponse {
  int64 ctrl_nbr = 1;
  int64 parent_ctrl_nbr = 2;
  int64 dynamic_group_ctrl_nbr = 3;
  string name = 4;
  string default_call_sheet_view = 5;
}
