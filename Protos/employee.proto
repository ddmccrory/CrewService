syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "common.proto";
package employee;

service EmployeeSrvc {
  rpc GetAllEmployeesAsync(GetAllEmployeesRequest) returns (GetAllEmployeesResponse) {
    option (google.api.http) = { get: "/v1/employees" };
  }
  rpc GetEmployeeAsync(GetEmployeeRequest) returns (GetEmployeeResponse) {
    option (google.api.http) = { get: "/v1/employees/{ctrl_nbr}" };
  }
  rpc GetEmployeeByNumberAsync(GetEmployeeByNumberRequest) returns (GetEmployeeResponse) {
    option (google.api.http) = { get: "/v1/employees/by-number/{employee_number}" };
  }
  rpc CreateEmployeeAsync(CreateEmployeeRequest) returns (CreateEmployeeResponse) {
    option (google.api.http) = { post: "/v1/employees" body: "*" };
  }
  rpc UpdateEmployeeAsync(UpdateEmployeeRequest) returns (UpdateEmployeeResponse) {
    option (google.api.http) = { put: "/v1/employees/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteEmployeeAsync(DeleteEmployeeRequest) returns (DeleteEmployeeResponse) {
    option (google.api.http) = { delete: "/v1/employees/{ctrl_nbr}" };
  }
  rpc AddAddressAsync(AddAddressRequest) returns (AddressResponse) {
    option (google.api.http) = { post: "/v1/employees/{employee_ctrl_nbr}/addresses" body: "*" };
  }
  rpc UpdateAddressAsync(UpdateAddressRequest) returns (AddressResponse) {
    option (google.api.http) = { put: "/v1/employees/{employee_ctrl_nbr}/addresses/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteAddressAsync(DeleteAddressRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/employees/{employee_ctrl_nbr}/addresses/{ctrl_nbr}" };
  }
  rpc AddPhoneNumberAsync(AddPhoneNumberRequest) returns (PhoneNumberResponse) {
    option (google.api.http) = { post: "/v1/employees/{employee_ctrl_nbr}/phones" body: "*" };
  }
  rpc UpdatePhoneNumberAsync(UpdatePhoneNumberRequest) returns (PhoneNumberResponse) {
    option (google.api.http) = { put: "/v1/employees/{employee_ctrl_nbr}/phones/{ctrl_nbr}" body: "*" };
  }
  rpc DeletePhoneNumberAsync(DeletePhoneNumberRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/employees/{employee_ctrl_nbr}/phones/{ctrl_nbr}" };
  }
  rpc AddEmailAddressAsync(AddEmailAddressRequest) returns (EmailAddressResponse) {
    option (google.api.http) = { post: "/v1/employees/{employee_ctrl_nbr}/emails" body: "*" };
  }
  rpc UpdateEmailAddressAsync(UpdateEmailAddressRequest) returns (EmailAddressResponse) {
    option (google.api.http) = { put: "/v1/employees/{employee_ctrl_nbr}/emails/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteEmailAddressAsync(DeleteEmailAddressRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/employees/{employee_ctrl_nbr}/emails/{ctrl_nbr}" };
  }
  rpc GetEmployeeWorkProfile(GetEmployeeWorkProfileRequest) returns (EmployeeWorkProfileResponse) {
    option (google.api.http) = { get: "/v1/employees/{employee_ctrl_nbr}/work-profile" };
  }
  // Open on-duty records for an employee (not yet tied up) — shown on the Work & Staffing tab.
  rpc GetEmployeeOpenOnDutyRecords(GetEmployeeOpenOnDutyRecordsRequest) returns (EmployeeOnDutyRecordsResponse) {
    option (google.api.http) = { get: "/v1/employees/{employee_ctrl_nbr}/on-duty/open" };
  }
  // Completed on-duty history for an employee within a pay-period window — On-Duty History tab.
  rpc GetEmployeeOnDutyHistory(GetEmployeeOnDutyHistoryRequest) returns (EmployeeOnDutyRecordsResponse) {
    option (google.api.http) = { get: "/v1/employees/{employee_ctrl_nbr}/on-duty/history" };
  }
  rpc CompleteDeferredOnDutyRecord(CompleteDeferredOnDutyRecordRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { post: "/v1/employees/{employee_ctrl_nbr}/on-duty/{on_duty_record_ctrl_nbr}/complete" body: "*" };
  }
  rpc GetDutyStatusNotStarted(GetDutyStatusNotStartedRequest) returns (EmployeeOnDutyRecordsResponse) {
    option (google.api.http) = { get: "/v1/railroads/{railroad_ctrl_nbr}/on-duty/not-started" };
  }
  rpc GetEligibleAbsenceEmployeesAsync(GetEligibleAbsenceEmployeesRequest) returns (GetAllEmployeesResponse) {
    option (google.api.http) = { get: "/v1/employees/eligible-absence" };
  }
}

// ── Work Profile ─────────────────────────────────────────────────────────────
message GetEmployeeWorkProfileRequest {
  int64 employee_ctrl_nbr = 1;
  int64 parent_ctrl_nbr   = 2;
  int64 railroad_ctrl_nbr = 3;
}

message EmployeeWorkProfileResponse {
  // Header enrichment
  string role              = 1;
  string employment_date   = 2;
  string employment_status = 3;
  // Whether the employee is currently permitted to bid on bulletins (based on their board position rules)
  bool   can_bid_on_bulletins = 7;
  // Work & Staffing tab data
  repeated WorkProfileSeniorityEntry seniority_entries = 4;
  repeated WorkProfileSeniorityMove  moves             = 5;
  repeated WorkProfileBulletinBid    bids              = 6;
}

message WorkProfileSeniorityEntry {
  int64  ctrl_nbr                 = 1;
  int64  roster_ctrl_nbr          = 2;
  string roster_name              = 3;
  string roster_date              = 4;
  int32  rank                     = 5;
  int64  seniority_state_ctrl_nbr = 6;
  string seniority_state_name     = 7;
  bool   last_active_roster       = 8;
  // Current position — empty strings if unassigned
  string position_name          = 9;
  string position_type          = 10;
  string position_assigned_date = 11;
  int64  craft_ctrl_nbr         = 12;
  int32  days_on_current_position = 13;
}

message WorkProfileSeniorityMove {
  int64  ctrl_nbr                  = 1;
  int64  craft_ctrl_nbr            = 2;
  int64  target_position_ctrl_nbr  = 3;
  int64  displaced_employee_ctrl_nbr = 4;
  string requested_local           = 5;
  string effective_local           = 6;
  int32  days_on_current_position  = 7;
  string move_type                 = 8;
  string status                    = 9;
  string rejection_reason          = 10;
  string cancellation_reason       = 11;
  // True when the move may still be cancelled (status- and cancel-window-aware).
  bool   can_cancel                = 12;
  // Display name of the target position (e.g. "350 / Engineer"); empty if unresolved.
  string target_position_name      = 13;
}

message WorkProfileBulletinBid {
  reserved 6;                          // was bulletin_code (no display value)
  reserved "bulletin_code";
  int64  ctrl_nbr             = 1;
  int64  bulletin_ctrl_nbr    = 2;
  int32  priority             = 3;
  string submitted_utc        = 4;
  string status               = 5;
  string position_name        = 7;
  // Work-area-localized ISO-8601 (offset-carrying) instants for display.
  string bid_window_closes_local = 8;
  string effective_local         = 9;
}

// ── Employee On-Duty (open records + history) ────────────────────────────────
message GetEmployeeOpenOnDutyRecordsRequest {
  int64 employee_ctrl_nbr = 1;
}

message GetEmployeeOnDutyHistoryRequest {
  int64 employee_ctrl_nbr = 1;
  // Pay-period window: 1=CurrentWorkPeriod, 2=PreviousWorkPeriod, 3=CurrentMonth,
  // 4=PreviousMonth, 5=YearToDate. Mirrors the legacy on-duty history dropdown.
  int32 period            = 2;
  // Railroad whose configured WorkPeriodMode determines the work-period window bounds.
  int64 railroad_ctrl_nbr = 3;
}

message EmployeeOnDutyRecordsResponse {
  repeated EmployeeOnDutyRecord records = 1;
}

message EmployeeOnDutyRecord {
  int64  ctrl_nbr               = 1;
  string previous_rest_hours    = 2;
  string assignment_name        = 3;
  string assignment_code        = 4;
  string crew_name              = 5;
  string craft_role_name        = 6;
  string location               = 7;
  string on_duty_utc            = 8;
  // Work-area-localized ISO-8601 on-duty time for wall-clock display.
  string on_duty_local          = 9;
  string off_duty_utc           = 10;
  // Work-area-localized ISO-8601 off-duty time; empty when the record is still open.
  string off_duty_local         = 11;
  // Total time on duty in minutes; 0/absent when the record is still open.
  int32  total_time_on_duty_min = 12;
  int32  consecutive_days       = 13;
  bool   is_assigned            = 14;
  bool   is_late_call           = 15;
  string status                 = 16;
  int64  work_area_ctrl_nbr     = 17;
  string work_area_name         = 18;
  string completion_status      = 19;
  bool   is_quick_tie_up        = 20;
  string rested_at_utc          = 21;
  bool   off_duty_time_confirmed = 22;
  string off_duty_time_confirmed_at_utc = 23;
  string off_duty_time_confirmed_by = 24;
  string work_area_code = 25;
  string employee_name = 26;
  string employee_number = 27;
  int64  employee_ctrl_nbr = 28;
  int64  craft_ctrl_nbr = 29;
  string assignment_off_duty_local = 30;
}

message CompleteDeferredOnDutyRecordRequest {
  int64 employee_ctrl_nbr = 1;
  int64 on_duty_record_ctrl_nbr = 2;
  google.protobuf.Timestamp off_duty_time_utc = 3;
}

message GetDutyStatusNotStartedRequest {
  int64 railroad_ctrl_nbr = 1;
}

message GetEligibleAbsenceEmployeesRequest {
  int64 parent_ctrl_nbr = 1;
  int64 railroad_ctrl_nbr = 2;
  int64 craft_ctrl_nbr = 3;
  int64 department_ctrl_nbr = 4;
}

message GetAllEmployeesRequest {
  int32 page_number = 1;
  int32 page_size = 2;
  int64 client_ctrl_nbr = 3;
}

message GetAllEmployeesResponse {
  repeated GetEmployeeResponse employees = 1;
  int32 total_count = 2;
}

message GetEmployeeRequest {
  int64 ctrl_nbr = 1;
}

message GetEmployeeByNumberRequest {
  string employee_number = 1;
}

message EmployeeActions {
  bool can_edit_detail = 1;
}

message GetEmployeeResponse {
  int64 ctrl_nbr = 1;
  int64 client_ctrl_nbr = 2;
  string user_id = 3;
  string employee_number = 4;
  string social_security_number = 5;
  string gender = 6;
  string race = 7;
  string marital_status = 8;
  google.protobuf.Timestamp birth_date = 9;
  google.protobuf.Timestamp employment_date = 10;
  int64 employment_status_ctrl_nbr = 11;
  bool allow_fmla_mark_off = 12;
  bool call_for_overtime = 13;
  bool process_payroll = 14;
  bool tie_up_off_property = 15;
  string drivers_license_number = 16;
  string issuing_state = 17;
  repeated AddressResponse addresses = 18;
  repeated PhoneNumberResponse phone_numbers = 19;
  repeated EmailAddressResponse email_addresses = 20;
  string full_name_lnf = 21;
  string first_name = 22;
  string middle_name = 23;
  string last_name = 24;
  bool can_edit_employee_detail = 25;
  EmployeeActions actions = 26;
  string theme_name = 27;
  string theme_mode = 28;
}

message CreateEmployeeRequest {
  int64 client_ctrl_nbr = 1;
  string email = 2;
  string employee_number = 3;
  string social_security_number = 4;
  string gender = 5;
  string race = 6;
  google.protobuf.Timestamp birth_date = 7;
  google.protobuf.Timestamp employment_date = 8;
  int64 employment_status_ctrl_nbr = 9;
  string drivers_license_number = 10;
  string issuing_state = 11;
  string marital_status = 12;
  string first_name = 13;
  string middle_name = 14;
  string last_name = 15;
}

message CreateEmployeeResponse {
  int64 ctrl_nbr = 1;
  string employee_number = 2;
  bool success = 3;
  repeated string messages = 4;
}

message UpdateEmployeeRequest {
  int64 ctrl_nbr = 1;
  string drivers_license_number = 2;
  string issuing_state = 3;
  string marital_status = 4;
  bool allow_fmla_mark_off = 5;
  bool call_for_overtime = 6;
  bool process_payroll = 7;
  bool tie_up_off_property = 8;
  string gender = 9;
  string race = 10;
  string first_name = 11;
  string middle_name = 12;
  string last_name = 13;
}

message UpdateEmployeeResponse {
  int64 ctrl_nbr = 1;
  bool success = 2;
  repeated string messages = 3;
}

message DeleteEmployeeRequest {
  int64 ctrl_nbr = 1;
}

message DeleteEmployeeResponse {
  bool success = 1;
  repeated string messages = 2;
}

message AddAddressRequest {
  int64 employee_ctrl_nbr = 1;
  string address1 = 2;
  string address2 = 3;
  string city = 4;
  string state = 5;
  string zip_code = 6;
  int64 address_type_ctrl_nbr = 7;
}

message UpdateAddressRequest {
  int64 employee_ctrl_nbr = 1;
  int64 ctrl_nbr = 2;
  string address1 = 3;
  string address2 = 4;
  string city = 5;
  string state = 6;
  string zip_code = 7;
}

message DeleteAddressRequest {
  int64 employee_ctrl_nbr = 1;
  int64 ctrl_nbr = 2;
}

message AddressResponse {
  int64 ctrl_nbr = 1;
  int64 address_type_ctrl_nbr = 2;
  string address1 = 3;
  string address2 = 4;
  string city = 5;
  string state = 6;
  string zip_code = 7;
  bool success = 8;
  repeated string messages = 9;
}

message AddPhoneNumberRequest {
  int64 employee_ctrl_nbr = 1;
  string number = 2;
  int32 calling_order = 3;
  bool dial_one = 4;
  int64 phone_type_ctrl_nbr = 5;
}

message UpdatePhoneNumberRequest {
  int64 employee_ctrl_nbr = 1;
  int64 ctrl_nbr = 2;
  string number = 3;
  int32 calling_order = 4;
  bool dial_one = 5;
}

message DeletePhoneNumberRequest {
  int64 employee_ctrl_nbr = 1;
  int64 ctrl_nbr = 2;
}

message PhoneNumberResponse {
  int64 ctrl_nbr = 1;
  int64 phone_type_ctrl_nbr = 2;
  string number = 3;
  int32 calling_order = 4;
  bool dial_one = 5;
  bool success = 6;
  repeated string messages = 7;
}

message AddEmailAddressRequest {
  int64 employee_ctrl_nbr = 1;
  string email = 2;
  int64 email_type_ctrl_nbr = 3;
}

message UpdateEmailAddressRequest {
  int64 employee_ctrl_nbr = 1;
  int64 ctrl_nbr = 2;
  string email = 3;
}

message DeleteEmailAddressRequest {
  int64 employee_ctrl_nbr = 1;
  int64 ctrl_nbr = 2;
}

message EmailAddressResponse {
  int64 ctrl_nbr = 1;
  int64 email_type_ctrl_nbr = 2;
  string email = 3;
  bool success = 4;
  repeated string messages = 5;
}