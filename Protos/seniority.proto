syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
import "common.proto";
package seniority;

service SenioritySrvc {
  rpc GetAllAsync(GetAllSeniorityRequest) returns (GetAllSeniorityResponse) {
    option (google.api.http) = { get: "/v1/seniority" };
  }
  rpc GetAsync(GetSeniorityRequest) returns (SeniorityResponse) {
    option (google.api.http) = { get: "/v1/seniority/{ctrl_nbr}" };
  }
  rpc CreateAsync(CreateSeniorityRequest) returns (SeniorityResponse) {
    option (google.api.http) = { post: "/v1/seniority" body: "*" };
  }
  rpc UpdateAsync(UpdateSeniorityRequest) returns (SeniorityResponse) {
    option (google.api.http) = { put: "/v1/seniority/{ctrl_nbr}" body: "*" };
  }
  rpc DeleteAsync(DeleteSeniorityRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/seniority/{ctrl_nbr}" };
  }
  rpc GetActiveCraftForEmployee(GetActiveCraftRequest) returns (ActiveCraftResponse) {
    option (google.api.http) = { get: "/v1/seniority/active-craft/{employee_ctrl_nbr}" };
  }
  rpc ScheduleStateChangeAsync(ScheduleStateChangeRequest) returns (PendingStateChangeResponse) {
    option (google.api.http) = { post: "/v1/seniority/schedule-state-change" body: "*" };
  }
  rpc GetPendingStateChangeAsync(GetPendingStateChangeRequest) returns (PendingStateChangeResponse) {
    option (google.api.http) = { get: "/v1/seniority/{seniority_ctrl_nbr}/pending-state-change" };
  }
  rpc CancelPendingStateChangeAsync(CancelPendingStateChangeRequest) returns (common.DeleteResponse) {
    option (google.api.http) = { delete: "/v1/seniority/pending-state-change/{pending_change_ctrl_nbr}" };
  }
  rpc GetAllPendingStateChangesAsync(GetAllPendingStateChangesRequest) returns (GetAllPendingStateChangesResponse) {
    option (google.api.http) = { get: "/v1/seniority/pending-state-changes" };
  }
  rpc GetNextStateChangeEventAsync(GetNextStateChangeEventRequest) returns (GetNextStateChangeEventResponse) {
    option (google.api.http) = { get: "/v1/seniority/pending-state-changes/next-event" };
  }
}

message GetAllSeniorityRequest {
  int64 roster_ctrl_nbr = 1;
  int32 page_number = 2;
  int32 page_size = 3;
}

message GetAllSeniorityResponse {
  repeated SeniorityResponse seniority = 1;
  int32 total_count = 2;
}

message GetSeniorityRequest {
  int64 ctrl_nbr = 1;
}

message CreateSeniorityRequest {
  int64 roster_ctrl_nbr = 1;
  int64 employee_ctrl_nbr = 2;
  bool last_active_roster = 3;
  string roster_date = 4;
  int32 rank = 5;
  int64 seniority_state_ctrl_nbr = 6;
  bool can_train = 7;
}

message UpdateSeniorityRequest {
  int64 ctrl_nbr = 1;
  bool last_active_roster = 2;
  string roster_date = 3;
  int32 rank = 4;
  int64 seniority_state_ctrl_nbr = 5;
  bool can_train = 6;
}

message DeleteSeniorityRequest {
  int64 ctrl_nbr = 1;
}

message SeniorityResponse {
  int64 ctrl_nbr = 1;
  int64 roster_ctrl_nbr = 2;
  int64 employee_ctrl_nbr = 3;
  bool last_active_roster = 4;
  string roster_date = 5;
  int32 rank = 6;
  int64 seniority_state_ctrl_nbr = 7;
  bool can_train = 8;
  bool success = 9;
  repeated string messages = 10;
  string employee_number = 11;
  string employee_user_id = 12;
  string seniority_state_name = 13;
  string employee_full_name_lnf = 14;
  repeated string restriction_labels = 15;
}
message GetActiveCraftRequest {
  int64 employee_ctrl_nbr = 1;
}

message ActiveCraftResponse {
  int64 craft_ctrl_nbr = 1;
  string craft_name = 2;
  bool found = 3;
}

message ScheduleStateChangeRequest {
  int64 seniority_ctrl_nbr = 1;
  int64 to_state_ctrl_nbr = 2;
  string effective_date_utc = 3;
}

message GetPendingStateChangeRequest {
  int64 seniority_ctrl_nbr = 1;
}

message CancelPendingStateChangeRequest {
  int64 pending_change_ctrl_nbr = 1;
}

message PendingStateChangeResponse {
  int64 ctrl_nbr = 1;
  int64 seniority_ctrl_nbr = 2;
  int64 employee_ctrl_nbr = 3;
  int64 from_state_ctrl_nbr = 4;
  int64 to_state_ctrl_nbr = 5;
  string effective_date_utc = 6;
  string status = 7;
  string scheduled_by_user_id = 8;
  string scheduled_at_utc = 9;
  bool found = 10;
  bool success = 11;
  repeated string messages = 12;
}

message GetAllPendingStateChangesRequest {
  int64 railroad_ctrl_nbr = 1;
}

message PendingStateChangeListItem {
  int64 ctrl_nbr = 1;
  int64 seniority_ctrl_nbr = 2;
  int64 employee_ctrl_nbr = 3;
  string employee_number = 4;
  string employee_full_name_lnf = 5;
  int64 from_state_ctrl_nbr = 6;
  string from_state_name = 7;
  int64 to_state_ctrl_nbr = 8;
  string to_state_name = 9;
  string effective_date_utc = 10;
  string scheduled_by_user_id = 11;
  string scheduled_at_utc = 12;
  string scheduled_by_user_name = 13;
}

message GetAllPendingStateChangesResponse {
  repeated PendingStateChangeListItem pending_changes = 1;
}

message GetNextStateChangeEventRequest {
  int64 railroad_ctrl_nbr = 1;
}

message GetNextStateChangeEventResponse {
  string next_event_local = 1;
}
