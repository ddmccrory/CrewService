syntax = "proto3";
option csharp_namespace = "CrewService.Presentation";
import "google/api/annotations.proto";
package account;

service AccountSrvc {
	rpc ModifyTheme (ThemeRequest) returns (ThemeResponse){
		option (google.api.http) = { post: "/account/manage/theme" };
	}
	rpc GetProfile (GetProfileRequest) returns (GetProfileResponse){
		option (google.api.http) = { get: "/account/manage/profile" };
	}
	rpc ModifyProfile (ProfileRequest) returns (ProfileResponse){
		option (google.api.http) = { post: "/account/manage" };
	}
}

message ThemeRequest{
	string user_name = 1;
	string theme_name = 2;
	string theme_mode = 3;
}
message ThemeResponse{
	bool success = 1;
	repeated string message = 2;
}
message GetProfileRequest{
	string user_name = 1;
}
message GetProfileResponse{
	string first_name = 1;
	string middle_name = 2;
	string last_name = 3;
	string full_name = 4;
	bool success = 5;
	repeated string message = 6;
}
message ProfileRequest{
	string user_name = 1;
	string first_name = 2;
	string middle_name = 3;
	string last_name = 4;
}
message ProfileResponse{
	bool success = 1;
	repeated string message = 2;
	string full_name = 3;
}